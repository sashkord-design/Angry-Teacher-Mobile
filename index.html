<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Angry Teacher - Mobile Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f7f3e9;
      --card-bg: #fffdf7;
      --card-back-bg: #1e3a40;
      --primary-teal: #2b6777;
      --accent-gold: #e5a93c;
      --accent-red: #d9534f;
      --dark-text: #222222;
      --border-dark: #1f1f1f;
      --shadow-color: rgba(31, 31, 31, 0.85);
      --font-heading: 'Fredoka', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-body);
      color: var(--dark-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 6px 6px;
      position: relative;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* TOP HEADER PANEL */
    .header-panel {
      background: #f7f3e9;
      border: 3px solid var(--border-dark);
      border-radius: 14px;
      padding: 6px 8px;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .teacher-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .teacher-avatar-svg {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-title {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--border-dark);
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .game-subtitle {
      font-size: 0.55rem;
      font-weight: 800;
      color: var(--accent-red);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .stats-row {
      display: flex;
      gap: 5px;
    }

    .stat-pill {
      background: var(--accent-gold);
      border: 2px solid var(--border-dark);
      border-radius: 10px;
      padding: 2px 6px;
      text-align: center;
      min-width: 50px;
      box-shadow: 0 2px 0 var(--shadow-color);
    }

    .stat-pill.teal {
      background: var(--primary-teal);
      color: #ffffff;
    }

    .stat-label {
      font-size: 0.5rem;
      font-weight: 800;
      text-transform: uppercase;
      display: block;
      opacity: 0.9;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 0.8rem;
      line-height: 1.1;
    }

    /* DEFINITION DISPLAY PANEL */
    .definition-card {
      background: var(--primary-teal);
      border: 3px solid var(--border-dark);
      border-radius: 14px;
      padding: 8px 10px;
      color: #ffffff;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 56px;
    }

    .definition-text {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      flex-grow: 1;
      font-style: italic;
    }

    /* UNIFIED TIMER & NEXT BUTTON STYLES */
    .timer-badge, .next-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 2px solid var(--border-dark);
      border-radius: 9px;
      padding: 2px 6px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      white-space: nowrap;
      box-shadow: 0 2px 0 var(--border-dark);
      min-width: 44px;
      height: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--border-dark);
    }

    .next-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .next-arrow {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      line-height: 1;
    }

    .next-label {
      font-size: 0.4rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
    }

    /* 3 COLUMNS CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    /* 3D FLIP CARD STYLES */
    .card {
      perspective: 1000px;
      height: 68px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 2.5px solid var(--border-dark);
      border-radius: 11px;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
    }

    .card-front {
      background-color: var(--card-bg);
      color: var(--border-dark);
    }

    .card-word {
      font-family: var(--font-heading);
      font-size: clamp(0.7rem, 3.2vw, 0.88rem);
      word-break: normal;
      overflow-wrap: normal;
      hyphens: manual;
      text-align: center;
      line-height: 1.1;
      width: 100%;
    }

    .card-back {
      background-color: var(--card-back-bg);
      color: #ffffff;
      transform: rotateY(180deg);
      border-color: var(--border-dark);
    }

    .card-back-text {
      font-size: 0.58rem;
      line-height: 1.2;
      font-weight: 400;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card.matched .card-front {
      background-color: #a8dadc;
      opacity: 0.6;
      cursor: default;
    }

    /* OVERLAY SCREEN (START / BOOM) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 31, 31, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-color);
      border: 4px solid var(--border-dark);
      border-radius: 20px;
      padding: 20px 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 6px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      color: var(--accent-red);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .modal-desc {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--dark-text);
    }

    .modal-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      padding: 10px 20px;
      font-family: var(--font-heading);
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border-dark);
      width: 100%;
      margin-top: 4px;
    }

    .modal-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-dark);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- START & GAME OVER OVERLAY SCREEN -->
  <div class="modal-overlay" id="modal-screen">
    <div class="modal-box">
      <svg class="teacher-avatar-svg" viewBox="0 0 100 100" style="width:64px; height:64px;">
        <path d="M45 20 Q55 5 70 12" stroke="#d9534f" stroke-width="4" fill="none" stroke-dasharray="3,3"/>
        <circle cx="72" cy="11" r="5" fill="#f39c12"/>
        <circle cx="50" cy="58" r="34" fill="#d9534f" stroke="#1f1f1f" stroke-width="4"/>
        <rect x="42" y="16" width="16" height="10" fill="#1f1f1f" rx="3"/>
        <circle cx="38" cy="52" r="5" fill="#ffffff"/>
        <circle cx="62" cy="52" r="5" fill="#ffffff"/>
        <circle cx="39" cy="52" r="2.5" fill="#1f1f1f"/>
        <circle cx="61" cy="52" r="2.5" fill="#1f1f1f"/>
        <path d="M30 44 L44 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M70 44 L56 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M36 68 Q50 60 64 68" stroke="#1f1f1f" stroke-width="3" fill="none"/>
      </svg>
      
      <div class="modal-title" id="modal-title">ANGRY TEACHER</div>
      
      <div class="modal-desc" id="modal-desc">
        Don't let the angry teacher explode — match the correct word!<br><br>
        <strong>You have 25 seconds for each word.</strong>
      </div>
      
      <button class="modal-btn" id="modal-btn">START GAME</button>
    </div>
  </div>

  <div id="app-container">
    <!-- TOP CONTROL PANEL -->
    <div class="header-panel">
      <div class="teacher-badge">
        <svg class="teacher-avatar-svg" viewBox="0 0 100 100">
          <path d="M45 20 Q55 5 70 12" stroke="#d9534f" stroke-width="4" fill="none" stroke-dasharray="3,3"/>
          <circle cx="72" cy="11" r="5" fill="#f39c12"/>
          <circle cx="50" cy="58" r="34" fill="#d9534f" stroke="#1f1f1f" stroke-width="4"/>
          <rect x="42" y="16" width="16" height="10" fill="#1f1f1f" rx="3"/>
          <circle cx="38" cy="52" r="5" fill="#ffffff"/>
          <circle cx="62" cy="52" r="5" fill="#ffffff"/>
          <circle cx="39" cy="52" r="2.5" fill="#1f1f1f"/>
          <circle cx="61" cy="52" r="2.5" fill="#1f1f1f"/>
          <path d="M30 44 L44 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
          <path d="M70 44 L56 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
          <path d="M36 68 Q50 60 64 68" stroke="#1f1f1f" stroke-width="3" fill="none"/>
        </svg>

        <div class="title-block">
          <div class="game-title">Angry Teacher</div>
          <div class="game-subtitle">YOU MESS UP - HE EXPLODES!</div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pill">
          <span class="stat-label">Level</span>
          <span class="stat-value" id="level-num">1</span>
        </div>
        <div class="stat-pill teal">
          <span class="stat-label">Progress</span>
          <span class="stat-value" id="progress-val">0/9</span>
        </div>
      </div>
    </div>

    <!-- DEFINITION DISPLAY PANEL -->
    <div class="definition-card">
      <div class="timer-badge" id="timer">25s</div>
      <div class="definition-text" id="def-text">Ready to play?</div>
      <button class="next-btn disabled" id="next-btn" title="Next Word">
        <span class="next-arrow">→</span>
        <span class="next-label">next</span>
      </button>
    </div>

    <!-- CARDS GRID (3 PER ROW) -->
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <script>

      { word: "Enable", def: "To give someone or something the authority or means", example: "Glasses enable people to see clearly." },
      { word: "Encourage", def: "To give support, confidence, or hope to someone", example: "Parents should encourage children to read." },
      { word: "Endure", def: "To suffer something painful or difficult patiently", example: "Pioneers had to endure harsh winters." },
      { word: "Energy", def: "The strength and vitality required for sustained activity", example: "A healthy diet gives you more daily energy." },
      { word: "Engage", def: "To occupy or attract someone's attention or interest", example: "Good stories engage readers from the start." },
      { word: "Enormous", def: "Very large in size or quantity", example: "They adopted an enormous dog." },
      { word: "Ensure", def: "To make certain that something shall occur", example: "Double check your work to ensure accuracy." },
      { word: "Entertain", def: "To provide with amusement or enjoyment", example: "Magicians love to entertain children." },
      { word: "Entire", def: "With no exception; whole or complete", example: "She read the entire book in one evening." },
      { word: "Environment", def: "The surroundings or conditions in which a person lives", example: "We must protect our natural environment." },
      { word: "Establish", def: "To set up on a permanent or firm basis", example: "The company was established in 2010." },
      { word: "Estimate", def: "Roughly calculate or judge the value or number", example: "Can you estimate the total repair cost?" },
      { word: "Evaluate", def: "To form an idea of the amount or value of", example: "Teachers evaluate students at end of term." },
      { word: "Evidence", def: "The available body of facts indicating truth", example: "Police found clear evidence at the crime scene." },
      { word: "Examine", def: "To inspect someone or something in detail", example: "Doctors examine patients to diagnose illness." },
      { word: "Exceed", def: "To be greater in number or size than a quantity", example: "Speed limits must not be exceeded." },
      { word: "Exchange", def: "To give something and receive something else", example: "They like to exchange cultural stories." },
      { word: "Expand", def: "To become or make larger or more extensive", example: "The business plans to expand overseas." },
      { word: "Expect", def: "To regard something as likely to happen", example: "I expect to finish this report by Friday." },
      { word: "Experience", def: "Practical contact with and observation of facts", example: "Job experience is vital for your resume." },
      { word: "Explain", def: "To make clear to someone by describing", example: "Can you explain this math rule to me?" },
      { word: "Express", def: "To convey a thought or feeling in words", example: "Art is a great way to express emotions." },
      { word: "Extensive", def: "Covering a large area; large in amount", example: "The library has an extensive collection of maps." },
      { word: "Factor", def: "A circumstance, fact, or influence that contributes", example: "Weather is a key factor in crop growth." },
      { word: "Familiar", def: "Well known from close association", example: "That voice sounds very familiar to me." },
      { word: "Feature", def: "A distinctive attribute or aspect of something", example: "Autofocus is a great camera feature." },
      { word: "Fierce", def: "Having or displaying an aggressive intensity", example: "There was fierce competition for the prize." },
      { word: "Flexible", def: "Capable of bending easily without breaking", example: "Yoga helps keep your body flexible." },
      { word: "Focus", def: "The center of interest or activity", example: "Try to focus on your grammar exercises." },
      { word: "fortunate", def: "Favored by or involving good luck", example: "We were fortunate to catch the last train." },
      { word: "Frequent", def: "Occurring or done on many occasions", example: "Bus delays are frequent in winter." },
      { word: "Function", def: "An activity or purpose natural to a person or thing", example: "What is the main function of this button?" },
      { word: "Generate", def: "To produce or create something", example: "Wind turbines generate clean electricity." },
      { word: "Genuine", def: "Truly what something is said to be; authentic", example: "This ring is made of genuine gold." },
      { word: "Global", def: "Relating to the whole world; worldwide", example: "Internet has created a global village." },
      { word: "Gradual", def: "Taking place or progressing slowly or by degrees", example: "There was a gradual change in weather." },
      { word: "Guarantee", def: "A formal promise or assurance", example: "The store offers a two-year guarantee." }
    ];

    const levelConfigs = [
      { level: 1, count: 9 },
      { level: 2, count: 12 },
      { level: 3, count: 15 },
      { level: 4, count: 18 },
      { level: 5, count: 21 }
    ];

    let currentLevelIdx = 0;
    let score = 0;
    let targetItem = null;
    let timerInterval = null;
    let timeLeft = 25;
    let isGameOver = false;
    let waitingForNext = false;
    let audioCtx = null;

    const gridEl = document.getElementById("cards-grid");
    const defTextEl = document.getElementById("def-text");
    const levelNumEl = document.getElementById("level-num");
    const progressValEl = document.getElementById("progress-val");
    const timerEl = document.getElementById("timer");
    const nextBtnEl = document.getElementById("next-btn");
    const modalScreen = document.getElementById("modal-screen");
    const modalTitle = document.getElementById("modal-title");
    const modalDesc = document.getElementById("modal-desc");
    const modalBtn = document.getElementById("modal-btn");

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSuccessSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      } catch (e) {}
    }

    function playErrorSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    let selectedMaleVoice = null;
    function loadBestMaleVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      selectedMaleVoice = voices.find(v => v.lang.startsWith('en') && (
        v.name.includes('Google UK English Male') || 
        v.name.includes('Daniel') || 
        v.name.includes('Oliver') || 
        v.name.includes('David') || 
        v.name.includes('George') || 
        v.name.includes('Ryan') ||
        v.name.toLowerCase().includes('male')
      )) || voices.find(v => v.lang.startsWith('en') && !v.name.toLowerCase().includes('female')) 
         || voices.find(v => v.lang.startsWith('en'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadBestMaleVoice;
      loadBestMaleVoice();
    }

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-GB';
      if (selectedMaleVoice) utterance.voice = selectedMaleVoice;
      utterance.rate = 0.88;
      utterance.pitch = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function startGame() {
      initAudio();
      currentLevelIdx = 0;
      isGameOver = false;
      modalScreen.classList.add("hidden");
      initLevel();
    }

    function initLevel() {
      const config = levelConfigs[currentLevelIdx];
      levelNumEl.textContent = config.level;
      score = 0;
      updateProgress();

      const currentCards = [...vocabularyDB]
        .sort(() => Math.random() - 0.5)
        .slice(0, config.count);

      renderGrid(currentCards);
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");
      pickNextTarget();
    }

    function renderGrid(cards) {
      gridEl.innerHTML = "";
      cards.forEach(item => {
        const cardNode = document.createElement("div");
        cardNode.className = "card";
        cardNode.dataset.word = item.word;

        cardNode.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <div class="card-word">${item.word}</div>
            </div>
            <div class="card-back">
              <div class="card-back-text">"${item.example}"</div>
            </div>
          </div>
        `;

        cardNode.addEventListener("click", () => handleCardClick(cardNode, item));
        gridEl.appendChild(cardNode);
      });
    }

    function pickNextTarget() {
      const remainingCards = Array.from(gridEl.children)
        .filter(c => !c.classList.contains("matched"))
        .map(c => vocabularyDB.find(v => v.word === c.dataset.word));

      if (remainingCards.length === 0) {
        clearInterval(timerInterval);
        if (currentLevelIdx < levelConfigs.length - 1) {
          currentLevelIdx++;
          initLevel();
        } else {
          playSuccessSound();
          showGameOverScreen("VICTORY!", "🎉 You beat all 5 levels without making the teacher explode!", "PLAY AGAIN");
        }
        return;
      }

      targetItem = remainingCards[Math.floor(Math.random() * remainingCards.length)];
      defTextEl.textContent = `"${targetItem.def}"`;
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");

      resetTimer();
    }

    function handleCardClick(cardNode, item) {
      if (cardNode.classList.contains("matched") || isGameOver || waitingForNext) return;

      if (item.word === targetItem.word) {
        playSuccessSound();
        clearInterval(timerInterval);
        waitingForNext = true;
        
        cardNode.classList.add("flipped", "matched");
        score++;
        updateProgress();
        speakWord(item.word);

        nextBtnEl.classList.remove("disabled");

        const remainingUnmatched = Array.from(gridEl.children).filter(c => !c.classList.contains("matched"));
        if (remainingUnmatched.length === 0) {
          setTimeout(() => {
            if (currentLevelIdx < levelConfigs.length - 1) {
              currentLevelIdx++;
              initLevel();
            } else {
              showGameOverScreen("VICTORY!", "🎉 You beat all 5 levels without making the teacher explode!", "PLAY AGAIN");
            }
          }, 1800);
        }
      } else {
        playErrorSound();
        clearInterval(timerInterval);
        isGameOver = true;
        showGameOverScreen("BOOM!", "💥 Your teacher exploded!", "TRY AGAIN");
      }
    }

    function updateProgress() {
      const total = levelConfigs[currentLevelIdx].count;
      progressValEl.textContent = `${score}/${total}`;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = 25;
      timerEl.textContent = `${timeLeft}s`;
      timerInterval = setInterval(() => {
        if (waitingForNext || isGameOver) return;
        timeLeft--;
        timerEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          playErrorSound();
          isGameOver = true;
          showGameOverScreen("BOOM!", "💥 Your teacher exploded! Time ran out.", "TRY AGAIN");
        }
      }, 1000);
    }

    function showGameOverScreen(title, desc, btnText) {
      modalTitle.textContent = title;
      modalDesc.innerHTML = desc;
      modalBtn.textContent = btnText;
      modalScreen.classList.remove("hidden");
    }

    modalBtn.addEventListener("click", startGame);

    nextBtnEl.addEventListener("click", () => {
      if (waitingForNext && !isGameOver) {
        pickNextTarget();
      }
    });
  </script>
</body>
</html>
