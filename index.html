<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Angry Teacher - Mobile Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f7f3e9;
      --card-bg: #fffdf7;
      --card-back-bg: #1e3a40;
      --primary-teal: #2b6777;
      --accent-gold: #e5a93c;
      --accent-red: #d9534f;
      --dark-text: #222222;
      --border-dark: #1f1f1f;
      --shadow-color: rgba(31, 31, 31, 0.85);
      --font-heading: 'Fredoka', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-body);
      color: var(--dark-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 5px 6px;
      position: relative;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* SLIM TOP HEADER PANEL */
    .header-panel {
      background: #f7f3e9;
      border: 2.5px solid var(--border-dark);
      border-radius: 12px;
      padding: 4px 8px;
      box-shadow: 0px 2.5px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
    }

    .teacher-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .teacher-avatar-svg {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      color: var(--border-dark);
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .stats-row {
      display: flex;
      gap: 4px;
    }

    /* LEVEL PILL STYLING */
    .stat-pill.level-pill {
      background: var(--accent-gold);
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 2px 6px;
      text-align: center;
      min-width: 75px;
      box-shadow: 0 1.5px 0 var(--shadow-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-pill.teal {
      background: var(--primary-teal);
      color: #ffffff;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 2px 6px;
      text-align: center;
      min-width: 55px;
      box-shadow: 0 1.5px 0 var(--shadow-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-label {
      font-size: 0.45rem;
      font-weight: 800;
      text-transform: uppercase;
      display: block;
      opacity: 0.9;
      line-height: 1;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 0.7rem;
      line-height: 1.1;
      margin-top: 1px;
    }

    .level-title-sub {
      font-size: 0.45rem;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
      opacity: 0.85;
      margin-top: 1px;
    }

    /* EXPANDED DEFINITION DISPLAY PANEL */
    .definition-card {
      background: var(--primary-teal);
      border: 3px solid var(--border-dark);
      border-radius: 14px;
      padding: 10px 10px;
      color: #ffffff;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 68px;
    }

    .definition-text {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      flex-grow: 1;
      font-style: italic;
    }

    /* UNIFIED TIMER & NEXT BUTTON STYLES */
    .timer-badge, .next-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 2px solid var(--border-dark);
      border-radius: 9px;
      padding: 2px 6px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      white-space: nowrap;
      box-shadow: 0 2px 0 var(--border-dark);
      min-width: 44px;
      height: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--border-dark);
    }

    .next-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .next-arrow {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      line-height: 1;
    }

    .next-label {
      font-size: 0.4rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
    }

    /* 3 COLUMNS CARDS GRID (FIXED 3x3 = 9 CARDS) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    /* 3D FLIP CARD STYLES OPTIMIZED FOR 3x3 */
    .card {
      perspective: 1000px;
      height: 74px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 2.5px solid var(--border-dark);
      border-radius: 11px;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
      transition: background-color 0.3s ease;
    }

    .card-front {
      background-color: var(--card-bg);
      color: var(--border-dark);
    }

    .card-word {
      font-family: var(--font-heading);
      font-size: clamp(0.7rem, 3.2vw, 0.88rem);
      word-break: normal;
      overflow-wrap: normal;
      hyphens: manual;
      text-align: center;
      line-height: 1.1;
      width: 100%;
    }

    .card-back {
      background-color: var(--card-back-bg);
      color: #ffffff;
      transform: rotateY(180deg);
      border-color: var(--border-dark);
    }

    .card-back-text {
      font-size: 0.58rem;
      line-height: 1.2;
      font-weight: 400;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* HIGHLIGHT STATE (WARM GOLDEN GLOW) */
    .card.highlighted .card-front {
      background-color: #f9d98c;
      border-color: #e5a93c;
    }

    .card.matched .card-front {
      background-color: #a8dadc;
      opacity: 0.8;
    }

    /* OVERLAY SCREEN (START / BOOM / CHECKPOINT) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 31, 31, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-color);
      border: 4px solid var(--border-dark);
      border-radius: 20px;
      padding: 20px 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 6px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      color: var(--accent-red);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .modal-desc {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--dark-text);
    }

    .modal-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      padding: 9px 16px;
      font-family: var(--font-heading);
      font-size: 0.95rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border-dark);
      width: 100%;
    }

    .modal-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-dark);
    }

    .modal-btn.secondary {
      background: var(--primary-teal);
      color: #ffffff;
    }

    .level-select-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
      margin-top: 4px;
    }

    .level-sel-btn {
      background: var(--card-bg);
      border: 2px solid var(--border-dark);
      border-radius: 10px;
      padding: 8px 6px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .level-sel-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--border-dark);
    }

    .level-sel-btn.locked {
      background: #e0dcd0;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- START & CHECKPOINT OVERLAY SCREEN -->
  <div class="modal-overlay" id="modal-screen">
    <div class="modal-box">
      <svg class="teacher-avatar-svg" viewBox="0 0 100 100" style="width:54px; height:54px;">
        <path d="M45 20 Q55 5 70 12" stroke="#d9534f" stroke-width="4" fill="none" stroke-dasharray="3,3"/>
        <circle cx="72" cy="11" r="5" fill="#f39c12"/>
        <circle cx="50" cy="58" r="34" fill="#d9534f" stroke="#1f1f1f" stroke-width="4"/>
        <rect x="42" y="16" width="16" height="10" fill="#1f1f1f" rx="3"/>
        <circle cx="38" cy="52" r="5" fill="#ffffff"/>
        <circle cx="62" cy="52" r="5" fill="#ffffff"/>
        <circle cx="39" cy="52" r="2.5" fill="#1f1f1f"/>
        <circle cx="61" cy="52" r="2.5" fill="#1f1f1f"/>
        <path d="M30 44 L44 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M70 44 L56 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M36 68 Q50 60 64 68" stroke="#1f1f1f" stroke-width="3" fill="none"/>
      </svg>
      
      <div class="modal-title" id="modal-title">ANGRY TEACHER</div>
      
      <div class="modal-desc" id="modal-desc">
        Don't let the angry teacher explode — match the correct word!<br><br>
        <strong>Each level features 9 cards with random words.</strong>
      </div>
      
      <div id="modal-buttons-container" style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
        <button class="modal-btn" id="modal-btn">START GAME</button>
      </div>
    </div>
  </div>

  <div id="app-container">
    <!-- SLIM TOP HEADER PANEL -->
    <div class="header-panel">
      <div class="teacher-badge">
        <svg class="teacher-avatar-svg" viewBox="0 0 100 100">
          <path d="M45 20 Q55 5 70 12" stroke="#d9534f" stroke-width="4" fill="none" stroke-dasharray="3,3"/>
          <circle cx="72" cy="11" r="5" fill="#f39c12"/>
          <circle cx="50" cy="58" r="34" fill="#d9534f" stroke="#1f1f1f" stroke-width="4"/>
          <rect x="42" y="16" width="16" height="10" fill="#1f1f1f" rx="3"/>
          <circle cx="38" cy="52" r="5" fill="#ffffff"/>
          <circle cx="62" cy="52" r="5" fill="#ffffff"/>
          <circle cx="39" cy="52" r="2.5" fill="#1f1f1f"/>
          <circle cx="61" cy="52" r="2.5" fill="#1f1f1f"/>
          <path d="M30 44 L44 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
          <path d="M70 44 L56 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
          <path d="M36 68 Q50 60 64 68" stroke="#1f1f1f" stroke-width="3" fill="none"/>
        </svg>

        <div class="title-block">
          <div class="game-title">Angry Teacher</div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pill level-pill" id="level-pill-btn" style="cursor: pointer;" title="Select Level">
          <span class="stat-value" id="level-num">LEVEL 1</span>
          <span class="level-title-sub" id="level-title-sub">Freshman</span>
        </div>
        <div class="stat-pill teal">
          <span class="stat-label">Progress</span>
          <span class="stat-value" id="progress-val">0/9</span>
        </div>
      </div>
    </div>

    <!-- EXPANDED DEFINITION DISPLAY PANEL -->
    <div class="definition-card">
      <div class="timer-badge" id="timer">25s</div>
      <div class="definition-text" id="def-text">Ready to play?</div>
      <button class="next-btn disabled" id="next-btn" title="Next Word">
        <span class="next-arrow">→</span>
        <span class="next-label">next</span>
      </button>
    </div>

    <!-- CARDS GRID (FIXED 3x3) -->
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <script>
    // 40 WORDS PER LEVEL (TOTAL 200 WORDS POOL)
    const vocabularyDBByLevel = {
      1: [
        { word: "Notice", def: "To see or hear someone or something", example: "Did you notice her new haircut today?" },
        { word: "Refuse", def: "To say no when someone asks you to do something", example: "They refuse to give up hope." },
        { word: "Decide", def: "To choose something after thinking about it", example: "It is hard to decide which laptop to buy." },
        { word: "Avoid", def: "To try not to do something or stay away from it", example: "Try to avoid eating junk food late at night." },

        { word: "Appear", def: "To become noticeable or to start to be seen", example: "The sun began to appear through the clouds." },
        { word: "Arrive", def: "To reach a place at the end of a journey", example: "What time will the train arrive?" },
        { word: "Borrow", def: "To take and use something with the promise to return it", example: "Can I borrow your pen for a second?" },
        { word: "Breathe", def: "To take air into your lungs and let it out", example: "Relax, close your eyes, and breathe deeply." },
        { word: "Catch", def: "To capture or grab something moving through the air", example: "He tried to catch the flying ball." },
        { word: "Clean", def: "Free from dirt, marks, or stains", example: "Keep your room clean and tidy." },
        { word: "Climb", def: "To go up or ascend using feet and hands", example: "They love to climb mountains on weekends." },
        { word: "Collect", def: "To bring things together from different places", example: "She likes to collect vintage stamps." },
        { word: "Common", def: "Happening often or existing in large numbers", example: "Colds are very common in winter." },
        { word: "Compare", def: "To look at things to see how they are similar", example: "Compare these two smartphones before buying." },
        { word: "Complain", def: "To express dissatisfaction about something", example: "He always complains about the weather." },
        { word: "Complete", def: "To finish making or doing something", example: "Please complete the form in black ink." },
        { word: "Connect", def: "To join two or more things together", example: "Connect your phone to the charger." },
        { word: "Continue", def: "To keep doing something without stopping", example: "Let's continue our lesson tomorrow." },
        { word: "Control", def: "To have power over someone or something", example: "You must learn to control your temper." },
        { word: "Correct", def: "Free from error; true or accurate", example: "Your answer to this test question is correct." },
        { word: "Damage", def: "Physical harm caused to something", example: "The storm caused major damage to roofs." },
        { word: "Danger", def: "The possibility of suffering harm or injury", example: "Children should be kept away from danger." },
        { word: "Deliver", def: "To bring goods or letters to a destination", example: "The postman will deliver a parcel today." },
        { word: "Depend", def: "Be controlled or determined by something else", example: "Success depends on your daily effort." },
        { word: "Describe", def: "To give an account in words of someone or something", example: "Can you describe the missing dog?" },
        { word: "Desert", def: "A dry, barren area of land covered with sand", example: "It is very hot during the day in the desert." },
        { word: "Direct", def: "Extending in a straight line without stopping", example: "We took a direct flight to Paris." },
        { word: "Discuss", def: "To talk about something with someone else", example: "We need to discuss our vacation plans." }
      ],
      2: [
        { word: "Challenge", def: "Something new and difficult to do", example: "He accepted the challenge with enthusiasm." },
        { word: "Imagine", def: "To picture something in your mind", example: "Can you imagine living on Mars?" },
        { word: "Discover", def: "To find something for the first time", example: "Scientists discover new species every year." },
        { word: "Reduce", def: "To make something smaller or less", example: "We should reduce plastic consumption." },
        { word: "Solve", def: "To find the correct answer to a problem", example: "Can you solve this complex math puzzle?" },

        { word: "Organize", def: "To put things in good order", example: "Help me organize these files alphabetically." },
        { word: "Explore", def: "To look around a new place to learn about it", example: "Let's explore the old town streets." },
        { word: "Advantage", def: "Something good that helps you succeed", example: "Speaking two languages is a big advantage." },

        { word: "Complex", def: "Consisting of many different connected parts", example: "The human brain is a complex organ." },
        { word: "Concept", def: "An abstract idea or general notion", example: "The concept of time fascinates physicists." },
        { word: "Conclude", def: "To bring something to an end", example: "To conclude, I want to thank everyone." },
        { word: "Condition", def: "The state of something, especially physical fitness", example: "The car is in excellent condition." },
        { word: "Confirm", def: "To establish the truth or correctness of", example: "Please confirm your flight reservation." }
      ],
      3: [
        { word: "Achieve", def: "To successfully reach a desired goal through skill or effort", example: "Hard work helps you achieve your goals." },
        { word: "Succeed", def: "To accomplish a purpose or expected favorable outcome", example: "If you practice daily, you will succeed." },
        { word: "Convince", def: "To persuade someone firmly to believe or do something", example: "She tried to convince him to join the trip." },
        { word: "Encourage", def: "To inspire with confidence or hope to take action", example: "Parents should encourage children to read." },

    const levelConfigs = [

    // Load saved progress from localStorage
    function loadProgress() {
      const saved = localStorage.getItem("angryTeacherMaxLevel");
      if (saved) {
        maxUnlockedLevel = parseInt(saved, 10) || 1;
      }
    }

    function saveProgress() {
      if (currentLevelIdx + 1 > maxUnlockedLevel) {
        maxUnlockedLevel = currentLevelIdx + 1;
        localStorage.setItem("angryTeacherMaxLevel", maxUnlockedLevel);
      }
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSuccessSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(1318.51, now); 
        osc2.frequency.setValueAtTime(1975.54, now);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.6);
        osc2.stop(now + 0.6);
      } catch (e) {}
    }

    function playErrorSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    let selectedMaleVoice = null;
    function loadBestMaleVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      selectedMaleVoice = voices.find(v => v.lang.startsWith('en') && (
        v.name.includes('Google UK English Male') || 
        v.name.includes('Daniel') || 
        v.name.includes('Oliver') || 
        v.name.includes('David') || 
        v.name.includes('George') || 
        v.name.includes('Ryan') ||
        v.name.toLowerCase().includes('male')
      )) || voices.find(v => v.lang.startsWith('en') && !v.name.toLowerCase().includes('female')) 
         || voices.find(v => v.lang.startsWith('en'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadBestMaleVoice;
      loadBestMaleVoice();
    }

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-GB';
      if (selectedMaleVoice) utterance.voice = selectedMaleVoice;
      utterance.rate = 0.88;
      utterance.pitch = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function startGame(levelIdx = 0) {
      initAudio();
      currentLevelIdx = levelIdx;
      isGameOver = false;
      modalScreen.classList.add("hidden");
      initLevel();
    }

    function initLevel() {
      const config = levelConfigs[currentLevelIdx];
      levelNumEl.textContent = `LEVEL ${config.level}`;
      levelTitleSubEl.textContent = config.title;
      score = 0;
      updateProgress();

      const levelWordsPool = vocabularyDBByLevel[config.level] || vocabularyDBByLevel[1];
      // Pick 9 random words from the 40-word pool
      currentCardsPool = [...levelWordsPool]
        .sort(() => Math.random() - 0.5)
        .slice(0, 9);

      renderGrid(currentCardsPool);
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");
      pickNextTarget();
    }

    function renderGrid(cards) {
      gridEl.innerHTML = "";
      cards.forEach(item => {
        const cardNode = document.createElement("div");
        cardNode.className = "card";
        cardNode.dataset.word = item.word;

        cardNode.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <div class="card-word">${item.word}</div>
            </div>
            <div class="card-back">
              <div class="card-back-text">"${item.example}"</div>
            </div>
          </div>
        `;

        cardNode.addEventListener("click", () => handleCardClick(cardNode, item));
        gridEl.appendChild(cardNode);
      });
    }

    function pickNextTarget() {
      const remainingCards = Array.from(gridEl.children)
        .filter(c => !c.classList.contains("matched"))
        .map(c => currentCardsPool.find(v => v.word === c.dataset.word));

      if (remainingCards.length === 0) {
        clearInterval(timerInterval);
        playSuccessSound();
        saveProgress();
        
        if (currentLevelIdx < levelConfigs.length - 1) {
          showLevelCompletedScreen();
        } else {
          showGameOverScreen("VICTORY!", "🎉 You beat all 5 levels and became a true Doctor of Philosophy!", "PLAY AGAIN", () => startGame(0));
        }
        return;
      }

      targetItem = remainingCards[Math.floor(Math.random() * remainingCards.length)];
      defTextEl.textContent = `"${targetItem.def}"`;
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");

      resetTimer();
    }

    function handleCardClick(cardNode, item) {
      if (cardNode.classList.contains("matched")) {
        cardNode.classList.toggle("flipped");
        return;
      }

      if (isGameOver || waitingForNext) return;

      if (item.word === targetItem.word) {
        playSuccessSound();
        clearInterval(timerInterval);
        waitingForNext = true;
        
        cardNode.classList.add("highlighted");
        score++;
        updateProgress();
        speakWord(item.word);

        nextBtnEl.classList.remove("disabled");

        setTimeout(() => {
          cardNode.classList.remove("highlighted");
          cardNode.classList.add("flipped", "matched");

          const remainingUnmatched = Array.from(gridEl.children).filter(c => !c.classList.contains("matched"));
          if (remainingUnmatched.length === 0) {
            setTimeout(() => {
              clearInterval(timerInterval);
              saveProgress();
              if (currentLevelIdx < levelConfigs.length - 1) {
                showLevelCompletedScreen();
              } else {
                showGameOverScreen("VICTORY!", "🎉 You beat all 5 levels and became a true Doctor of Philosophy!", "PLAY AGAIN", () => startGame(0));
              }
            }, 1200);
          }
        }, 1500);

      } else {
        playErrorSound();
        clearInterval(timerInterval);
        isGameOver = true;
        showGameOverScreen("BOOM!", "💥 Your teacher exploded!", "RETRY LEVEL", () => startGame(currentLevelIdx));
      }
    }

    function updateProgress() {
      const total = 9; // Fixed 9 cards per level
      progressValEl.textContent = `${score}/${total}`;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = 25;
      timerEl.textContent = `${timeLeft}s`;
      timerInterval = setInterval(() => {
        if (waitingForNext || isGameOver) return;
        timeLeft--;
        timerEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          playErrorSound();
          isGameOver = true;
          showGameOverScreen("BOOM!", "💥 Your teacher exploded! Time ran out.", "RETRY LEVEL", () => startGame(currentLevelIdx));
        }
      }, 1000);
    }

    function showLevelCompletedScreen() {
      const currentTitle = levelConfigs[currentLevelIdx].title;
      const nextLevelIndex = currentLevelIdx + 1;
      const nextTitle = levelConfigs[nextLevelIndex].title;

      modalTitle.textContent = "LEVEL PASSED!";
      modalDesc.innerHTML = `🎉 Great job! You unlocked the rank of <strong>${currentTitle}</strong>.<br><br>Ready for the next challenge as a <strong>${nextTitle}</strong>?`;
      
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="next-level-btn">NEXT LEVEL (${nextTitle})</button>
        <button class="modal-btn secondary" id="menu-btn">LEVEL SELECT</button>
      `;

      modalScreen.classList.remove("hidden");

      document.getElementById("next-level-btn").addEventListener("click", () => {
        modalScreen.classList.add("hidden");
        currentLevelIdx = nextLevelIndex;
        initLevel();
      });

      document.getElementById("menu-btn").addEventListener("click", () => {
        showLevelSelectMenu();
      });
    }

    function showGameOverScreen(title, desc, btnText, callback) {
      modalTitle.textContent = title;
      modalDesc.innerHTML = desc;
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="modal-action-btn">${btnText}</button>
        <button class="modal-btn secondary" id="menu-btn">LEVEL SELECT</button>
      `;
      modalScreen.classList.remove("hidden");

      document.getElementById("modal-action-btn").addEventListener("click", () => {
        modalScreen.classList.add("hidden");
        callback();
      });

      document.getElementById("menu-btn").addEventListener("click", () => {
        showLevelSelectMenu();
      });
    }

    function showLevelSelectMenu() {
      loadProgress();
      modalTitle.textContent = "SELECT LEVEL";
      modalDesc.textContent = "Choose any unlocked level to play:";
      
      let gridHtml = '<div class="level-select-grid">';
      levelConfigs.forEach((cfg, idx) => {
        const isUnlocked = (idx + 1) <= maxUnlockedLevel;
        gridHtml += `
          <button class="level-sel-btn ${isUnlocked ? '' : 'locked'}" data-lvl="${idx}" ${isUnlocked ? '' : 'disabled'}>
            <strong>Lvl ${cfg.level}</strong>
            <span style="font-size:0.6rem; opacity:0.8;">${cfg.title}</span>
          </button>
        `;
      });
      gridHtml += '</div>';

      modalButtonsContainer.innerHTML = gridHtml + `<button class="modal-btn secondary" id="back-start-btn" style="margin-top:6px;">BACK</button>`;

      document.querySelectorAll(".level-sel-btn").forEach(btn => {
        if (!btn.classList.contains("locked")) {
          btn.addEventListener("click", (e) => {
            const lvlIdx = parseInt(e.currentTarget.dataset.lvl, 10);
            startGame(lvlIdx);
          });
        }
      });

      document.getElementById("back-start-btn").addEventListener("click", () => {
        showStartScreen();
      });
    }

    function showStartScreen() {
      loadProgress();
      modalTitle.textContent = "ANGRY TEACHER";
      modalDesc.innerHTML = `Don't let the angry teacher explode — match the correct word!<br><br><strong>Each level features 9 cards with random words.</strong>`;
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="modal-start-btn">START GAME</button>
        <button class="modal-btn secondary" id="modal-levels-btn">SELECT LEVEL</button>
      `;

      document.getElementById("modal-start-btn").addEventListener("click", () => {
        // Start from current max unlocked or level 1
        startGame(0);
      });

      document.getElementById("modal-levels-btn").addEventListener("click", () => {
        showLevelSelectMenu();
      });
    }

    // Click on Level Pill header opens Level Select Menu
    levelPillBtn.addEventListener("click", () => {
      clearInterval(timerInterval);
      modalScreen.classList.remove("hidden");
      showLevelSelectMenu();
    });

    // Initial load
    loadProgress();
    showStartScreen();

    nextBtnEl.addEventListener("click", () => {
      if (waitingForNext && !isGameOver) {
        pickNextTarget();
      }
    });
  </script>
</body>
</html>
