<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Angry Teacher - Mobile Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f7f3e9;
      --card-bg: #fffdf7;
      --card-back-bg: #1e3a40;
      --primary-teal: #2b6777;
      --accent-gold: #e5a93c;
      --accent-red: #d9534f;
      --dark-text: #222222;
      --border-dark: #1f1f1f;
      --shadow-color: rgba(31, 31, 31, 0.85);
      --font-heading: 'Fredoka', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-body);
      color: var(--dark-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 5px 6px;
      position: relative;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .header-panel {
      background: #f7f3e9;
      border: 2.5px solid var(--border-dark);
      border-radius: 12px;
      padding: 4px 8px;
      box-shadow: 0px 2.5px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
    }

    .teacher-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Аватарка в шапці гри без рамки */
    .teacher-avatar-img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* Аватарка у модальному вікні — збільшена та чиста */
    .modal-avatar-img {
      width: 85px;
      height: 85px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      color: var(--border-dark);
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .stats-row {
      display: flex;
      gap: 4px;
    }

    .stat-pill.level-pill {
      background: var(--accent-gold);
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 2px 6px;
      text-align: center;
      min-width: 75px;
      box-shadow: 0 1.5px 0 var(--shadow-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-pill.teal {
      background: var(--primary-teal);
      color: #ffffff;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 2px 6px;
      text-align: center;
      min-width: 55px;
      box-shadow: 0 1.5px 0 var(--shadow-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-label {
      font-size: 0.45rem;
      font-weight: 800;
      text-transform: uppercase;
      display: block;
      opacity: 0.9;
      line-height: 1;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 0.7rem;
      line-height: 1.1;
      margin-top: 1px;
    }

    .level-title-sub {
      font-size: 0.45rem;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
      opacity: 0.85;
      margin-top: 1px;
    }

    .definition-card {
      background: var(--primary-teal);
      border: 3px solid var(--border-dark);
      border-radius: 14px;
      padding: 10px 10px;
      color: #ffffff;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 68px;
    }

    .definition-text {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      flex-grow: 1;
      font-style: italic;
    }

    .timer-badge, .next-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 2px solid var(--border-dark);
      border-radius: 9px;
      padding: 2px 6px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      white-space: nowrap;
      box-shadow: 0 2px 0 var(--border-dark);
      min-width: 44px;
      height: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--border-dark);
    }

    .next-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .next-arrow {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      line-height: 1;
    }

    .next-label {
      font-size: 0.4rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .card {
      perspective: 1000px;
      height: 82px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 2.5px solid var(--border-dark);
      border-radius: 11px;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
      transition: background-color 0.3s ease;
    }

    .card-front {
      background-color: var(--card-bg);
      color: var(--border-dark);
    }

    .card-word {
      font-family: var(--font-heading);
      font-size: clamp(0.7rem, 3.2vw, 0.88rem);
      text-align: center;
      line-height: 1.1;
      width: 100%;
    }

    .card-back {
      background-color: var(--card-back-bg);
      color: #ffffff;
      transform: rotateY(180deg);
      border-color: var(--border-dark);
      padding: 3px 5px;
    }

    .card-back-text {
      font-size: 0.52rem;
      line-height: 1.15;
      font-weight: 400;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card.highlighted .card-front {
      background-color: #f9d98c;
      border-color: #e5a93c;
    }

    .card.matched .card-front {
      background-color: #a8dadc;
      opacity: 0.8;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 31, 31, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-color);
      border: 4px solid var(--border-dark);
      border-radius: 20px;
      padding: 20px 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 6px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      color: var(--accent-red);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .modal-desc {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--dark-text);
    }

    .modal-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      padding: 9px 16px;
      font-family: var(--font-heading);
      font-size: 0.95rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border-dark);
      width: 100%;
    }

    .modal-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-dark);
    }

    .modal-btn.secondary {
      background: var(--primary-teal);
      color: #ffffff;
    }

    .level-select-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
      margin-top: 4px;
    }

    .level-sel-btn {
      background: var(--card-bg);
      border: 2px solid var(--border-dark);
      border-radius: 10px;
      padding: 8px 6px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .level-sel-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--border-dark);
    }

    .level-sel-btn.locked {
      background: #e0dcd0;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Стартове вікно із більшим логотипом без ромок -->
  <div class="modal-overlay" id="modal-screen">
    <div class="modal-box">
      <img src="teacher-face.png" alt="Angry Teacher" class="modal-avatar-img" />
      
      <div class="modal-title" id="modal-title">ANGRY TEACHER</div>
      
      <div class="modal-desc" id="modal-desc">
        Don't let the angry teacher explode — match the correct word!<br><br>
        <strong>You have 25 seconds for each word.</strong>
      </div>
      
      <div id="modal-buttons-container" style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
        <button class="modal-btn" id="modal-start-main-btn">START GAME</button>
      </div>
    </div>
  </div>

  <div id="app-container">
    <div class="header-panel">
      <div class="teacher-badge">
        <!-- Маленьке обличчя в шапці гри -->
        <img src="teacher-face.png" alt="Teacher" class="teacher-avatar-img" />

        <div class="title-block">
          <div class="game-title">Angry Teacher</div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pill level-pill" id="level-pill-btn" style="cursor: pointer;" title="Select Level">
          <span class="stat-value" id="level-num">LEVEL 1</span>
          <span class="level-title-sub" id="level-title-sub">Freshman</span>
        </div>
        <div class="stat-pill teal">
          <span class="stat-label">Progress</span>
          <span class="stat-value" id="progress-val">0/9</span>
        </div>
      </div>
    </div>

    <div class="definition-card">
      <div class="timer-badge" id="timer">25s</div>
      <div class="definition-text" id="def-text">Ready to play?</div>
      <button class="next-btn disabled" id="next-btn" title="Next Word">
        <span class="next-arrow">→</span>
        <span class="next-label">next</span>
      </button>
    </div>

    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <script>
    const vocabularyDBByLevel = {
      1: [
        { word: "Notice", entries: [{ def: "To see or hear someone or something", example: "Did you notice her new haircut today?" }, { def: "To become aware of something through observation", example: "I did not notice any strange signs." }] },
        { word: "Refuse", entries: [{ def: "To say no when someone asks you to do something", example: "They refuse to give up hope." }, { def: "To be unwilling to grant or accept something", example: "He refused to answer the difficult question." }] },
        { word: "Decide", entries: [{ def: "To choose something after thinking about it", example: "It is hard to decide which laptop to buy." }, { def: "To reach a final conclusion or resolution", example: "We decided to start our project early." }] },
        { word: "Avoid", entries: [{ def: "To try not to do something or stay away from it", example: "Try to avoid eating junk food late at night." }, { def: "To keep away from someone or something", example: "She tried to avoid traffic jams by leaving early." }] },
        { word: "Accept", entries: [{ def: "To take something that someone offers you", example: "He decided to accept the job offer." }, { def: "To recognize a situation as valid or true", example: "It is hard to accept sudden changes." }] },
        { word: "Future", entries: [{ def: "The time that will happen after now", example: "We must plan carefully for the future." }, { def: "Events that will happen in the time ahead", example: "Nobody can predict what the future holds." }] },
        { word: "Forgive", entries: [{ def: "To stop feeling angry at someone who made a mistake", example: "She decided to forgive his mistake." }, { def: "To pardon someone for an offense or wrongdoing", example: "It takes strength to truly forgive." }] },
        { word: "Believe", entries: [{ def: "To think that something is true or real", example: "Always believe in your own potential." }, { def: "To accept the word or statement of someone", example: "I believe every word she told me." }] },
        { word: "Protect", entries: [{ def: "To keep someone or something safe from harm", example: "Wear a helmet to protect your head." }, { def: "To shield from danger or injury", example: "Animals protect their young fiercely." }] },
        { word: "Provide", entries: [{ def: "To give someone something that they need", example: "Trees provide shade on sunny days." }, { def: "To supply or make available for use", example: "This guide provides useful tips." }] },
        { word: "Create", entries: [{ def: "To make something new or original", example: "Artists create beauty out of chaos." }, { def: "To bring something into existence", example: "Code helps us create interactive apps." }] },
        { word: "Expect", entries: [{ def: "To think that something will happen soon", example: "I expect to finish this report by Friday." }, { def: "To look forward to the arrival of someone", example: "We expect guests to arrive tonight." }] },
        { word: "Explain", entries: [{ def: "To tell someone details so they understand clearly", example: "Can you explain this math rule to me?" }, { def: "To make an idea clear by describing it", example: "The teacher explained the grammar lesson." }] },

        { word: "Improve", entries: [{ def: "To make something better than before", example: "Reading books helps improve your vocabulary." }, { def: "To achieve better standards or skills", example: "Practice daily to improve your piano skills." }] },

        { word: "Arrive", entries: [{ def: "To reach a place at the end of a journey", example: "What time will the train arrive?" }, { def: "To reach a destination or milestone", example: "Packages usually arrive within two days." }] },
        { word: "Borrow", entries: [{ def: "To take and use something with promise to return", example: "Can I borrow your pen for a second?" }, { def: "To temporarily obtain items from someone", example: "Students can borrow books from the library." }] },
        { word: "Breathe", entries: [{ def: "To take air into your lungs and let it out", example: "Relax, close your eyes, and breathe deeply." }, { def: "To inhale and exhale living air", example: "Fresh air helps you breathe much easier." }] },
        { word: "Catch", entries: [{ def: "To capture or grab something moving in air", example: "He tried to catch the flying ball." }, { def: "To intercept or seize a moving object", example: "She caught the keys thrown across the room." }] },
        { word: "Clean", entries: [{ def: "Free from dirt, marks, or stains", example: "Keep your room clean and tidy." }, { def: "To remove dirt or impurities from surfaces", example: "Please clean the kitchen counter after cooking." }] },
        { word: "Climb", entries: [{ def: "To go up or ascend using feet and hands", example: "They love to climb mountains on weekends." }, { def: "To move upwards on a steep surface", example: "Cats love to climb high trees." }] },
        { word: "Collect", entries: [{ def: "To bring things together from different places", example: "She likes to collect vintage stamps." }, { def: "To gather items into an organized group", example: "We collect donations for animal shelters." }] },
        { word: "Common", entries: [{ def: "Happening often or existing in large numbers", example: "Colds are very common in winter." }, { def: "Shared by or belonging to all people", example: "English is a common global language." }] },
        { word: "Compare", entries: [{ def: "To look at things to see how they are similar", example: "Compare these two smartphones before buying." }, { def: "To examine differences and similarities", example: "Let us compare notes from the meeting." }] },
        { word: "Complain", entries: [{ def: "To express dissatisfaction about something", example: "He always complains about the weather." }, { def: "To state that one is annoyed or unhappy", example: "Customers complained about slow service." }] }

      2: [

        { word: "Artificial", entries: [{ def: "Made by humans rather than occurring naturally", example: "This juice contains artificial flavors." }, { def: "Imitating a natural product; synthetic", example: "The garden features artificial turf." }] },

      3: [
        { word: "Achieve", entries: [{ def: "To successfully reach a desired goal through skill or effort", example: "Hard work helps you achieve your goals." }, { def: "To accomplish objectives through perseverance", example: "She achieved remarkable success in science." }] },
        { word: "Succeed", entries: [{ def: "To accomplish a purpose or expected favorable outcome", example: "If you practice daily, you will succeed." }, { def: "To attain prosperity, fame, or desired results", example: "Dedicated entrepreneurs usually succeed." }] },

    function loadProgress() {
      const saved = localStorage.getItem("angryTeacherMaxLevel");
      if (saved) {
        maxUnlockedLevel = parseInt(saved, 10) || 1;
      }
    }

    function saveProgress(completedLevelIdx) {
      const nextLvlNum = completedLevelIdx + 2;
      if (nextLvlNum > maxUnlockedLevel && nextLvlNum <= levelConfigs.length) {
        maxUnlockedLevel = nextLvlNum;
        localStorage.setItem("angryTeacherMaxLevel", maxUnlockedLevel);
      }
    }

    function getBestTime(lvlIdx) {
      const best = localStorage.getItem(`angryTeacherBestTime_lvl_${lvlIdx + 1}`);
      return best ? parseInt(best, 10) : null;
    }

    function saveBestTime(lvlIdx, seconds) {
      const currentBest = getBestTime(lvlIdx);
      if (currentBest === null || seconds < currentBest) {
        localStorage.setItem(`angryTeacherBestTime_lvl_${lvlIdx + 1}`, seconds);
        return true;
      }
      return false;
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSuccessSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(1318.51, now); 
        osc2.frequency.setValueAtTime(1975.54, now);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.6);
        osc2.stop(now + 0.6);
      } catch (e) {}
    }

    function playExplosionSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.8);

        oscGain.gain.setValueAtTime(0.4, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.8);

        const bufferSize = audioCtx.sampleRate * 0.8;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.linearRampToValueAtTime(100, now + 0.8);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.35, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        noise.start(now);
        noise.stop(now + 0.8);
      } catch (e) {}
    }

    function playErrorSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.35);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      } catch (e) {}
    }

    function getBestMaleVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return voices.find(v => v.lang.startsWith('en') && (
        v.name.includes('Google UK English Male') || 
        v.name.includes('Google US English') ||
        v.name.includes('Daniel') || 
        v.name.includes('Oliver') || 
        v.name.includes('David') || 
        v.name.includes('George') || 
        v.name.includes('Ryan') ||
        v.name.includes('Arthur') ||
        v.name.includes('Alex') ||
        v.name.toLowerCase().includes('male')
      )) || voices.find(v => v.lang.startsWith('en') && !v.name.toLowerCase().includes('female')) 
         || voices.find(v => v.lang.startsWith('en')) || voices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = getBestMaleVoice;
    }

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      
      const voice = getBestMaleVoice();
      if (voice) {
        utterance.voice = voice;
      }
      
      utterance.rate = 0.85;
      utterance.pitch = 0.75;
      
      window.speechSynthesis.speak(utterance);
    }

    function startGame(levelIdx = 0) {
      initAudio();
      currentLevelIdx = levelIdx;
      isGameOver = false;
      modalScreen.classList.add("hidden");
      initLevel();
    }

    function initLevel() {
      const config = levelConfigs[currentLevelIdx];
      levelNumEl.textContent = `LEVEL ${config.level}`;
      levelTitleSubEl.textContent = config.title;
      score = 0;
      updateProgress();

      levelSecondsElapsed = 0;
      clearInterval(levelTimerInterval);
      levelTimerInterval = setInterval(() => {
        if (!isGameOver && !waitingForNext) {
          levelSecondsElapsed++;
        }
      }, 1000);

      const levelWordsPool = vocabularyDBByLevel[config.level] || vocabularyDBByLevel[1];
      
      const selectedWords = [...levelWordsPool]
        .sort(() => Math.random() - 0.5)
        .slice(0, 9);

      currentCardsPool = selectedWords.map(item => {
        const randomEntry = item.entries[Math.floor(Math.random() * item.entries.length)];
        return {
          word: item.word,
          def: randomEntry.def,
          example: randomEntry.example
        };
      });

      renderGrid(currentCardsPool);
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");
      pickNextTarget();
    }

    function renderGrid(cards) {
      gridEl.innerHTML = "";
      cards.forEach(item => {
        const cardNode = document.createElement("div");
        cardNode.className = "card";
        cardNode.dataset.word = item.word;

        cardNode.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <div class="card-word">${item.word}</div>
            </div>
            <div class="card-back">
              <div class="card-back-text">"${item.example}"</div>
            </div>
          </div>
        `;

        cardNode.addEventListener("click", () => handleCardClick(cardNode, item));
        gridEl.appendChild(cardNode);
      });
    }

    function pickNextTarget() {
      const remainingCards = Array.from(gridEl.children)
        .filter(c => !c.classList.contains("matched"))
        .map(c => currentCardsPool.find(v => v.word === c.dataset.word));

      if (remainingCards.length === 0) {
        clearInterval(timerInterval);
        clearInterval(levelTimerInterval);
        playSuccessSound();
        saveProgress(currentLevelIdx);

        const isNewRecord = saveBestTime(currentLevelIdx, levelSecondsElapsed);
        
        if (currentLevelIdx < levelConfigs.length - 1) {
          showLevelCompletedScreen(isNewRecord, levelSecondsElapsed);
        } else {
          showGameOverScreen("VICTORY!", `🎉 You beat all 5 levels in ${levelSecondsElapsed}s!`, "PLAY AGAIN", () => startGame(0));
        }
        return;
      }

      targetItem = remainingCards[Math.floor(Math.random() * remainingCards.length)];
      defTextEl.textContent = `"${targetItem.def}"`;
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");

      resetTimer();
    }

    function handleCardClick(cardNode, item) {
      if (cardNode.classList.contains("matched")) {
        cardNode.classList.toggle("flipped");
        return;
      }

      if (isGameOver || waitingForNext) return;

      if (item.word === targetItem.word) {
        playSuccessSound();
        clearInterval(timerInterval);
        waitingForNext = true;
        
        cardNode.classList.add("highlighted");
        score++;
        updateProgress();
        
        speakWord(item.word);

        nextBtnEl.classList.remove("disabled");

        setTimeout(() => {
          cardNode.classList.remove("highlighted");
          cardNode.classList.add("flipped", "matched");

          const remainingUnmatched = Array.from(gridEl.children).filter(c => !c.classList.contains("matched"));
          if (remainingUnmatched.length === 0) {
            setTimeout(() => {
              clearInterval(timerInterval);
              clearInterval(levelTimerInterval);
              saveProgress(currentLevelIdx);
              const isNewRecord = saveBestTime(currentLevelIdx, levelSecondsElapsed);

              if (currentLevelIdx < levelConfigs.length - 1) {
                showLevelCompletedScreen(isNewRecord, levelSecondsElapsed);
              } else {
                showGameOverScreen("VICTORY!", `🎉 You beat all 5 levels in ${levelSecondsElapsed}s!`, "PLAY AGAIN", () => startGame(0));
              }
            }, 1200);
          }
        }, 1500);

      } else {
        playErrorSound();
        playExplosionSound();
        clearInterval(timerInterval);
        clearInterval(levelTimerInterval);
        isGameOver = true;
        showGameOverScreen("BOOM!", "💥 Your teacher exploded!", "RETRY LEVEL", () => startGame(currentLevelIdx));
      }
    }

    function updateProgress() {
      progressValEl.textContent = `${score}/9`;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = 25;
      timerEl.textContent = `${timeLeft}s`;
      timerInterval = setInterval(() => {
        if (waitingForNext || isGameOver) return;
        timeLeft--;
        timerEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          clearInterval(levelTimerInterval);
          playErrorSound();
          playExplosionSound();
          isGameOver = true;
          showGameOverScreen("BOOM!", "💥 Time ran out!", "RETRY LEVEL", () => startGame(currentLevelIdx));
        }
      }, 1000);
    }

    function showLevelCompletedScreen(isNewRecord, totalSeconds) {
      const currentTitle = levelConfigs[currentLevelIdx].title;
      const nextLevelIndex = currentLevelIdx + 1;
      const nextTitle = levelConfigs[nextLevelIndex].title;
      const best = getBestTime(currentLevelIdx);

      modalTitle.textContent = "LEVEL PASSED!";
      modalDesc.innerHTML = `🎉 Great job! Unlocked <strong>${currentTitle}</strong>.<br>` +
        `⏱ Time: <strong>${totalSeconds}s</strong> ${isNewRecord ? '🔥 (NEW RECORD!)' : `(Best: ${best}s)`}<br><br>` +
        `Next: <strong>${nextTitle}</strong>`;
      
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="next-level-btn">NEXT LEVEL</button>
        <button class="modal-btn secondary" id="menu-btn">LEVEL SELECT</button>
      `;

      modalScreen.classList.remove("hidden");

      document.getElementById("next-level-btn").addEventListener("click", () => {
        modalScreen.classList.add("hidden");
        currentLevelIdx = nextLevelIndex;
        initLevel();
      });

      document.getElementById("menu-btn").addEventListener("click", () => {
        showLevelSelectMenu();
      });
    }

    function showGameOverScreen(title, desc, btnText, callback) {
      modalTitle.textContent = title;
      modalDesc.innerHTML = desc;
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="modal-action-btn">${btnText}</button>
        <button class="modal-btn secondary" id="menu-btn">LEVEL SELECT</button>
      `;
      modalScreen.classList.remove("hidden");

      document.getElementById("modal-action-btn").addEventListener("click", () => {
        modalScreen.classList.add("hidden");
        callback();
      });

      document.getElementById("menu-btn").addEventListener("click", () => {
        showLevelSelectMenu();
      });
    }

    function showLevelSelectMenu() {
      loadProgress();
      modalTitle.textContent = "SELECT LEVEL";
      modalDesc.textContent = "Choose unlocked level:";
      
      let gridHtml = '<div class="level-select-grid">';
      levelConfigs.forEach((cfg, idx) => {
        const isUnlocked = (idx + 1) <= maxUnlockedLevel;
        const bestTime = getBestTime(idx);
        const timeStr = bestTime !== null ? `<br><span style="font-size:0.55rem; color:#2b6777;">Best: ${bestTime}s</span>` : '';
        gridHtml += `
          <button class="level-sel-btn ${isUnlocked ? '' : 'locked'}" data-lvl="${idx}" ${isUnlocked ? '' : 'disabled'}>
            <strong>Lvl ${cfg.level}</strong>
            <span style="font-size:0.6rem; opacity:0.8;">${cfg.title}</span>
            ${timeStr}
          </button>
        `;
      });
      gridHtml += '</div>';

      modalButtonsContainer.innerHTML = gridHtml + `<button class="modal-btn secondary" id="back-start-btn" style="margin-top:6px;">BACK</button>`;

      document.querySelectorAll(".level-sel-btn").forEach(btn => {
        if (!btn.classList.contains("locked")) {
          btn.addEventListener("click", (e) => {
            const lvlIdx = parseInt(e.currentTarget.dataset.lvl, 10);
            startGame(lvlIdx);
          });
        }
      });

      document.getElementById("back-start-btn").addEventListener("click", () => {
        showStartScreen();
      });
    }

    function showStartScreen() {
      loadProgress();
      modalTitle.textContent = "ANGRY TEACHER";
      modalDesc.innerHTML = `Don't let the angry teacher explode — match the correct word!<br><br><strong>You have 25 seconds for each word.</strong>`;
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="modal-start-main-btn">START GAME</button>
        <button class="modal-btn secondary" id="modal-levels-btn">SELECT LEVEL</button>
      `;

      document.getElementById("modal-start-main-btn").addEventListener("click", () => {
        const startLvl = Math.min(maxUnlockedLevel - 1, levelConfigs.length - 1);
        startGame(startLvl >= 0 ? startLvl : 0);
      });

      document.getElementById("modal-levels-btn").addEventListener("click", () => {
        showLevelSelectMenu();
      });
    }

    document.getElementById("modal-start-main-btn").addEventListener("click", () => {
      const startLvl = Math.min(maxUnlockedLevel - 1, levelConfigs.length - 1);
      startGame(startLvl >= 0 ? startLvl : 0);
    });

    levelPillBtn.addEventListener("click", () => {
      clearInterval(timerInterval);
      clearInterval(levelTimerInterval);
      modalScreen.classList.remove("hidden");
      showLevelSelectMenu();
    });

    loadProgress();

    nextBtnEl.addEventListener("click", () => {
      if (waitingForNext && !isGameOver) {
        pickNextTarget();
      }
    });
  </script>
</body>
</html>
