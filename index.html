<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Angry Teacher - Mobile Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f7f3e9;
      --card-bg: #fffdf7;
      --card-back-bg: #1e3a40;
      --primary-teal: #2b6777;
      --accent-gold: #e5a93c;
      --accent-red: #d9534f;
      --dark-text: #222222;
      --border-dark: #1f1f1f;
      --shadow-color: rgba(31, 31, 31, 0.85);
      --font-heading: 'Fredoka', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-body);
      color: var(--dark-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 5px 6px;
      position: relative;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* SLIM TOP HEADER PANEL */
    .header-panel {
      background: #f7f3e9;
      border: 2.5px solid var(--border-dark);
      border-radius: 12px;
      padding: 4px 8px;
      box-shadow: 0px 2.5px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
    }

    .teacher-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .teacher-avatar-svg {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      color: var(--border-dark);
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .stats-row {
      display: flex;
      gap: 4px;
    }

    .stat-pill {
      background: var(--accent-gold);
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 1px 5px;
      text-align: center;
      min-width: 44px;
      box-shadow: 0 1.5px 0 var(--shadow-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-pill.teal {
      background: var(--primary-teal);
      color: #ffffff;
    }

    .stat-label {
      font-size: 0.45rem;
      font-weight: 800;
      text-transform: uppercase;
      display: block;
      opacity: 0.9;
      line-height: 1;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      line-height: 1;
      margin-top: 1px;
    }

    /* EXPANDED DEFINITION DISPLAY PANEL */
    .definition-card {
      background: var(--primary-teal);
      border: 3px solid var(--border-dark);
      border-radius: 14px;
      padding: 10px 10px;
      color: #ffffff;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 68px;
    }

    .definition-text {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      flex-grow: 1;
      font-style: italic;
    }

    /* UNIFIED TIMER & NEXT BUTTON STYLES */
    .timer-badge, .next-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 2px solid var(--border-dark);
      border-radius: 9px;
      padding: 2px 6px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      white-space: nowrap;
      box-shadow: 0 2px 0 var(--border-dark);
      min-width: 44px;
      height: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--border-dark);
    }

    .next-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .next-arrow {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      line-height: 1;
    }

    .next-label {
      font-size: 0.4rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
    }

    /* 3 COLUMNS CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    /* 3D FLIP CARD STYLES */
    .card {
      perspective: 1000px;
      height: 68px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 2.5px solid var(--border-dark);
      border-radius: 11px;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
      transition: background-color 0.3s ease;
    }

    .card-front {
      background-color: var(--card-bg);
      color: var(--border-dark);
    }

    .card-word {
      font-family: var(--font-heading);
      font-size: clamp(0.7rem, 3.2vw, 0.88rem);
      word-break: normal;
      overflow-wrap: normal;
      hyphens: manual;
      text-align: center;
      line-height: 1.1;
      width: 100%;
    }

    .card-back {
      background-color: var(--card-back-bg);
      color: #ffffff;
      transform: rotateY(180deg);
      border-color: var(--border-dark);
    }

    .card-back-text {
      font-size: 0.58rem;
      line-height: 1.2;
      font-weight: 400;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* HIGHLIGHT STATE (WARM GOLDEN GLOW) */
    .card.highlighted .card-front {
      background-color: #f9d98c;
      border-color: #e5a93c;
    }

    .card.matched .card-front {
      background-color: #a8dadc;
      opacity: 0.8;
    }

    /* OVERLAY SCREEN (START / BOOM / CHECKPOINT) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 31, 31, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-color);
      border: 4px solid var(--border-dark);
      border-radius: 20px;
      padding: 20px 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 6px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      color: var(--accent-red);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .modal-desc {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--dark-text);
    }

    .modal-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      padding: 10px 20px;
      font-family: var(--font-heading);
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border-dark);
      width: 100%;
      margin-top: 4px;
    }

    .modal-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-dark);
    }

    .modal-btn.secondary {
      background: var(--primary-teal);
      color: #ffffff;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  </div>

  <div id="app-container">
    <!-- SLIM TOP HEADER PANEL -->
    <div class="header-panel">
      <div class="teacher-badge">
        <svg class="teacher-avatar-svg" viewBox="0 0 100 100">
          <path d="M45 20 Q55 5 70 12" stroke="#d9534f" stroke-width="4" fill="none" stroke-dasharray="3,3"/>

          <circle cx="38" cy="52" r="5" fill="#ffffff"/>
          <circle cx="62" cy="52" r="5" fill="#ffffff"/>

    <!-- EXPANDED DEFINITION DISPLAY PANEL -->
    <div class="definition-card">
      <div class="timer-badge" id="timer">25s</div>

      <button class="next-btn disabled" id="next-btn" title="Next Word">

      </button>
    </div>

    <!-- CARDS GRID (3 PER ROW) -->
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <script>
    const vocabularyDBByLevel = {
      1: [
        { word: "Notice", def: "To see or hear someone or something", example: "Did you notice her new haircut today?" },

        { word: "Imagine", def: "To picture something in your mind", example: "Can you imagine living on Mars?" },

      3: [
        { word: "Achieve", def: "To successfully reach a desired goal through skill or effort", example: "Hard work helps you achieve your goals." },
        { word: "Succeed", def: "To accomplish a purpose or expected favorable outcome", example: "If you practice daily, you will succeed." },
        { word: "Convince", def: "To persuade someone firmly to believe or do something", example: "She tried to convince him to join the trip." },
        { word: "Encourage", def: "To inspire with confidence or hope to take action", example: "Parents should encourage children to read." },
        { word: "Distribute", def: "To hand out or share something among a group of people", example: "Volunteers distribute food to the homeless." },
        { word: "Audience", def: "The assembled group of listeners or viewers at an event", example: "The audience clapped loudly after the show." },
        { word: "Campaign", def: "A planned series of organized actions to achieve a goal", example: "The charity launched a new winter campaign." },

    const levelConfigs = [
      { level: 1, count: 9, title: "Freshman" },
      { level: 2, count: 12, title: "Sophomore" },
      { level: 3, count: 15, title: "Junior Scholar" },
      { level: 4, count: 18, title: "Senior Expert" },
      { level: 5, count: 21, title: "Doctor of Philosophy (Ph.D.)" }

    let currentLevelIdx = 0;
    let score = 0;
    let targetItem = null;
    let timerInterval = null;
    let timeLeft = 25;
    let isGameOver = false;
    let waitingForNext = false;
    let audioCtx = null;
    let currentCardsPool = [];

    const gridEl = document.getElementById("cards-grid");
    const defTextEl = document.getElementById("def-text");
    const levelNumEl = document.getElementById("level-num");
    const progressValEl = document.getElementById("progress-val");
    const timerEl = document.getElementById("timer");
    const nextBtnEl = document.getElementById("next-btn");
    const modalScreen = document.getElementById("modal-screen");
    const modalTitle = document.getElementById("modal-title");
    const modalDesc = document.getElementById("modal-desc");
    const modalButtonsContainer = document.getElementById("modal-buttons-container");

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // PLEASANT HIGH BELL CHIME SOUND
    function playSuccessSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        // Bell frequencies (E6 and B6 notes for a bright magical chime)
        osc1.frequency.setValueAtTime(1318.51, now); 
        osc2.frequency.setValueAtTime(1975.54, now);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.6);
        osc2.stop(now + 0.6);
      } catch (e) {}
    }

    function playErrorSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    let selectedMaleVoice = null;
    function loadBestMaleVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      selectedMaleVoice = voices.find(v => v.lang.startsWith('en') && (
        v.name.includes('Google UK English Male') || 
        v.name.includes('Daniel') || 
        v.name.includes('Oliver') || 
        v.name.includes('David') || 
        v.name.includes('George') || 
        v.name.includes('Ryan') ||
        v.name.toLowerCase().includes('male')
      )) || voices.find(v => v.lang.startsWith('en') && !v.name.toLowerCase().includes('female')) 
         || voices.find(v => v.lang.startsWith('en'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadBestMaleVoice;
      loadBestMaleVoice();
    }

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-GB';
      if (selectedMaleVoice) utterance.voice = selectedMaleVoice;
      utterance.rate = 0.88;
      utterance.pitch = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function startGame() {
      initAudio();
      currentLevelIdx = 0;
      isGameOver = false;
      modalScreen.classList.add("hidden");
      initLevel();
    }

    function initLevel() {
      const config = levelConfigs[currentLevelIdx];
      levelNumEl.textContent = `${config.level} (${config.title})`;
      score = 0;
      updateProgress();

      const levelWordsPool = vocabularyDBByLevel[config.level] || vocabularyDBByLevel[1];
      currentCardsPool = [...levelWordsPool]
        .sort(() => Math.random() - 0.5)
        .slice(0, config.count);

      renderGrid(currentCardsPool);
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");
      pickNextTarget();
    }

    function renderGrid(cards) {
      gridEl.innerHTML = "";
      cards.forEach(item => {
        const cardNode = document.createElement("div");
        cardNode.className = "card";
        cardNode.dataset.word = item.word;

        cardNode.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <div class="card-word">${item.word}</div>
            </div>
            <div class="card-back">
              <div class="card-back-text">"${item.example}"</div>
            </div>
          </div>
        `;

        cardNode.addEventListener("click", () => handleCardClick(cardNode, item));
        gridEl.appendChild(cardNode);
      });
    }

    function pickNextTarget() {
      const remainingCards = Array.from(gridEl.children)
        .filter(c => !c.classList.contains("matched"))
        .map(c => currentCardsPool.find(v => v.word === c.dataset.word));

      if (remainingCards.length === 0) {
        clearInterval(timerInterval);
        playSuccessSound();
        
        if (currentLevelIdx < levelConfigs.length - 1) {
          showLevelCompletedScreen();
        } else {
          showGameOverScreen("VICTORY!", "🎉 You beat all 5 levels and became a true Doctor of Philosophy!", "PLAY AGAIN", startGame);
        }
        return;
      }

      targetItem = remainingCards[Math.floor(Math.random() * remainingCards.length)];
      defTextEl.textContent = `"${targetItem.def}"`;
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");

      resetTimer();
    }

    function handleCardClick(cardNode, item) {
      if (cardNode.classList.contains("matched")) {
        cardNode.classList.toggle("flipped");
        return;
      }

      if (isGameOver || waitingForNext) return;

      if (item.word === targetItem.word) {
        playSuccessSound();
        clearInterval(timerInterval);
        waitingForNext = true;
        
        cardNode.classList.add("highlighted");
        score++;
        updateProgress();
        speakWord(item.word);

        nextBtnEl.classList.remove("disabled");

        setTimeout(() => {
          cardNode.classList.remove("highlighted");
          cardNode.classList.add("flipped", "matched");

          const remainingUnmatched = Array.from(gridEl.children).filter(c => !c.classList.contains("matched"));
          if (remainingUnmatched.length === 0) {
            setTimeout(() => {
              clearInterval(timerInterval);
              if (currentLevelIdx < levelConfigs.length - 1) {
                showLevelCompletedScreen();
              } else {
                showGameOverScreen("VICTORY!", "🎉 You beat all 5 levels and became a true Doctor of Philosophy!", "PLAY AGAIN", startGame);
              }
            }, 1200);
          }
        }, 1500);

      } else {
        playErrorSound();
        clearInterval(timerInterval);
        isGameOver = true;
        showGameOverScreen("BOOM!", "💥 Your teacher exploded!", "TRY AGAIN", startGame);
      }
    }

    function updateProgress() {
      const total = levelConfigs[currentLevelIdx].count;
      progressValEl.textContent = `${score}/${total}`;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = 25;
      timerEl.textContent = `${timeLeft}s`;
      timerInterval = setInterval(() => {
        if (waitingForNext || isGameOver) return;
        timeLeft--;
        timerEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          playErrorSound();
          isGameOver = true;
          showGameOverScreen("BOOM!", "💥 Your teacher exploded! Time ran out.", "TRY AGAIN", startGame);
        }
      }, 1000);
    }

    function showLevelCompletedScreen() {
      const currentTitle = levelConfigs[currentLevelIdx].title;
      currentLevelIdx++;
      const nextTitle = levelConfigs[currentLevelIdx].title;

      modalTitle.textContent = "LEVEL PASSED!";
      modalDesc.innerHTML = `🎉 Great job! You unlocked the rank of <strong>${currentTitle}</strong>.<br><br>Ready for the next challenge as a <strong>${nextTitle}</strong>?`;
      
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="next-level-btn">NEXT LEVEL (${nextTitle})</button>
        <button class="modal-btn secondary" id="restart-btn">RESTART GAME</button>
      `;

      modalScreen.classList.remove("hidden");

      document.getElementById("next-level-btn").addEventListener("click", () => {
        modalScreen.classList.add("hidden");
        initLevel();
      });

      document.getElementById("restart-btn").addEventListener("click", () => {
        modalScreen.classList.add("hidden");
        startGame();
      });
    }

    function showGameOverScreen(title, desc, btnText, callback) {
      modalTitle.textContent = title;
      modalDesc.innerHTML = desc;
      modalButtonsContainer.innerHTML = `<button class="modal-btn" id="modal-action-btn">${btnText}</button>`;
      modalScreen.classList.remove("hidden");

      document.getElementById("modal-action-btn").addEventListener("click", () => {
        modalScreen.classList.add("hidden");
        callback();
      });
    }

    // Initial binding for start screen button
    document.getElementById("modal-btn").addEventListener("click", () => {
      modalButtonsContainer.innerHTML = `<button class="modal-btn" id="modal-action-btn">START GAME</button>`;
      startGame();
    });

    nextBtnEl.addEventListener("click", () => {
      if (waitingForNext && !isGameOver) {
        pickNextTarget();
      }
    });
  </script>
</body>
</html>
