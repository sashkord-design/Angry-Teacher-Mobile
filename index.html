<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Angry Teacher - Mobile Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f7f3e9;
      --card-bg: #fffdf7;
      --card-back-bg: #1e3a40;
      --primary-teal: #2b6777;
      --accent-gold: #e5a93c;
      --accent-red: #d9534f;
      --dark-text: #222222;
      --border-dark: #1f1f1f;
      --shadow-color: rgba(31, 31, 31, 0.85);
      --font-heading: 'Fredoka', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-body);
      color: var(--dark-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 5px 6px;
      position: relative;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .header-panel {
      background: #f7f3e9;
      border: 2.5px solid var(--border-dark);
      border-radius: 12px;
      padding: 4px 8px;
      box-shadow: 0px 2.5px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
    }

    .teacher-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .teacher-avatar-svg {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-title {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      color: var(--border-dark);
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .stats-row {
      display: flex;
      gap: 4px;
    }

    .stat-pill.level-pill {
      background: var(--accent-gold);
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 2px 6px;
      text-align: center;
      min-width: 75px;
      box-shadow: 0 1.5px 0 var(--shadow-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-pill.teal {
      background: var(--primary-teal);
      color: #ffffff;
      border: 2px solid var(--border-dark);
      border-radius: 8px;
      padding: 2px 6px;
      text-align: center;
      min-width: 55px;
      box-shadow: 0 1.5px 0 var(--shadow-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-label {
      font-size: 0.45rem;
      font-weight: 800;
      text-transform: uppercase;
      display: block;
      opacity: 0.9;
      line-height: 1;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 0.7rem;
      line-height: 1.1;
      margin-top: 1px;
    }

    .level-title-sub {
      font-size: 0.45rem;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1;
      opacity: 0.85;
      margin-top: 1px;
    }

    .definition-card {
      background: var(--primary-teal);
      border: 3px solid var(--border-dark);
      border-radius: 14px;
      padding: 10px 10px;
      color: #ffffff;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 68px;
    }

    .definition-text {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      flex-grow: 1;
      font-style: italic;
    }

    .timer-badge, .next-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 2px solid var(--border-dark);
      border-radius: 9px;
      padding: 2px 6px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      white-space: nowrap;
      box-shadow: 0 2px 0 var(--border-dark);
      min-width: 44px;
      height: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--border-dark);
    }

    .next-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .next-arrow {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      line-height: 1;
    }

    .next-label {
      font-size: 0.4rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .card {
      perspective: 1000px;
      height: 82px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 2.5px solid var(--border-dark);
      border-radius: 11px;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
      transition: background-color 0.3s ease;
    }

    .card-front {
      background-color: var(--card-bg);
      color: var(--border-dark);
    }

    .card-word {
      font-family: var(--font-heading);
      font-size: clamp(0.7rem, 3.2vw, 0.88rem);
      text-align: center;
      line-height: 1.1;
      width: 100%;
    }

    .card-back {
      background-color: var(--card-back-bg);
      color: #ffffff;
      transform: rotateY(180deg);
      border-color: var(--border-dark);
      padding: 3px 5px;
    }

    .card-back-text {
      font-size: 0.52rem;
      line-height: 1.15;
      font-weight: 400;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card.highlighted .card-front {
      background-color: #f9d98c;
      border-color: #e5a93c;
    }

    .card.matched .card-front {
      background-color: #a8dadc;
      opacity: 0.8;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 31, 31, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-color);
      border: 4px solid var(--border-dark);
      border-radius: 20px;
      padding: 20px 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 6px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      color: var(--accent-red);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .modal-desc {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--dark-text);
    }

    .modal-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      padding: 9px 16px;
      font-family: var(--font-heading);
      font-size: 0.95rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border-dark);
      width: 100%;
    }

    .modal-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-dark);
    }

    .modal-btn.secondary {
      background: var(--primary-teal);
      color: #ffffff;
    }

    .level-select-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      width: 100%;
      margin-top: 4px;
    }

    .level-sel-btn {
      background: var(--card-bg);
      border: 2px solid var(--border-dark);
      border-radius: 10px;
      padding: 8px 6px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .level-sel-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--border-dark);
    }

    .level-sel-btn.locked {
      background: #e0dcd0;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="modal-overlay" id="modal-screen">
    <div class="modal-box">
      <svg class="teacher-avatar-svg" viewBox="0 0 100 100" style="width:54px; height:54px;">
        <path d="M45 20 Q55 5 70 12" stroke="#d9534f" stroke-width="4" fill="none" stroke-dasharray="3,3"/>
        <circle cx="72" cy="11" r="5" fill="#f39c12"/>
        <circle cx="50" cy="58" r="34" fill="#d9534f" stroke="#1f1f1f" stroke-width="4"/>
        <rect x="42" y="16" width="16" height="10" fill="#1f1f1f" rx="3"/>
        <circle cx="38" cy="52" r="5" fill="#ffffff"/>
        <circle cx="62" cy="52" r="5" fill="#ffffff"/>
        <circle cx="39" cy="52" r="2.5" fill="#1f1f1f"/>
        <circle cx="61" cy="52" r="2.5" fill="#1f1f1f"/>
        <path d="M30 44 L44 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M70 44 L56 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M36 68 Q50 60 64 68" stroke="#1f1f1f" stroke-width="3" fill="none"/>
      </svg>
      
      <div class="modal-title" id="modal-title">ANGRY TEACHER</div>
      
      <div class="modal-desc" id="modal-desc">
        Don't let the angry teacher explode — match the correct word!<br><br>
        <strong>You have 25 seconds for each word.</strong>
      </div>
      
      <div id="modal-buttons-container" style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
        <button class="modal-btn" id="modal-start-main-btn">START GAME</button>
      </div>
    </div>
  </div>

  <div id="app-container">
    <div class="header-panel">
      <div class="teacher-badge">
        <svg class="teacher-avatar-svg" viewBox="0 0 100 100">
          <path d="M45 20 Q55 5 70 12" stroke="#d9534f" stroke-width="4" fill="none" stroke-dasharray="3,3"/>
          <circle cx="72" cy="11" r="5" fill="#f39c12"/>
          <circle cx="50" cy="58" r="34" fill="#d9534f" stroke="#1f1f1f" stroke-width="4"/>
          <rect x="42" y="16" width="16" height="10" fill="#1f1f1f" rx="3"/>
          <circle cx="38" cy="52" r="5" fill="#ffffff"/>
          <circle cx="62" cy="52" r="5" fill="#ffffff"/>
          <circle cx="39" cy="52" r="2.5" fill="#1f1f1f"/>
          <circle cx="61" cy="52" r="2.5" fill="#1f1f1f"/>
          <path d="M30 44 L44 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
          <path d="M70 44 L56 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
          <path d="M36 68 Q50 60 64 68" stroke="#1f1f1f" stroke-width="3" fill="none"/>
        </svg>

        <div class="title-block">
          <div class="game-title">Angry Teacher</div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pill level-pill" id="level-pill-btn" style="cursor: pointer;" title="Select Level">
          <span class="stat-value" id="level-num">LEVEL 1</span>
          <span class="level-title-sub" id="level-title-sub">Freshman</span>
        </div>
        <div class="stat-pill teal">
          <span class="stat-label">Progress</span>
          <span class="stat-value" id="progress-val">0/9</span>
        </div>
      </div>
    </div>

    <div class="definition-card">
      <div class="timer-badge" id="timer">25s</div>
      <div class="definition-text" id="def-text">Ready to play?</div>
      <button class="next-btn disabled" id="next-btn" title="Next Word">
        <span class="next-arrow">→</span>
        <span class="next-label">next</span>
      </button>
    </div>

    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <script>
    const vocabularyDBByLevel = {
      1: [
        { word: "Notice", entries: [{ def: "To see or hear someone or something", example: "Did you notice her new haircut today?" }, { def: "To become aware of something through observation", example: "I did not notice any strange signs." }] },
        { word: "Refuse", entries: [{ def: "To say no when someone asks you to do something", example: "They refuse to give up hope." }, { def: "To be unwilling to grant or accept something", example: "He refused to answer the difficult question." }] },
        { word: "Decide", entries: [{ def: "To choose something after thinking about it", example: "It is hard to decide which laptop to buy." }, { def: "To reach a final conclusion or resolution", example: "We decided to start our project early." }] },
        { word: "Avoid", entries: [{ def: "To try not to do something or stay away from it", example: "Try to avoid eating junk food late at night." }, { def: "To keep away from someone or something", example: "She tried to avoid traffic jams by leaving early." }] },
        { word: "Accept", entries: [{ def: "To take something that someone offers you", example: "He decided to accept the job offer." }, { def: "To recognize a situation as valid or true", example: "It is hard to accept sudden changes." }] },
        { word: "Future", entries: [{ def: "The time that will happen after now", example: "We must plan carefully for the future." }, { def: "Events that will happen in the time ahead", example: "Nobody can predict what the future holds." }] },
        { word: "Forgive", entries: [{ def: "To stop feeling angry at someone who made a mistake", example: "She decided to forgive his mistake." }, { def: "To pardon someone for an offense or wrongdoing", example: "It takes strength to truly forgive." }] },
        { word: "Believe", entries: [{ def: "To think that something is true or real", example: "Always believe in your own potential." }, { def: "To accept the word or statement of someone", example: "I believe every word she told me." }] },
        { word: "Protect", entries: [{ def: "To keep someone or something safe from harm", example: "Wear a helmet to protect your head." }, { def: "To shield from danger or injury", example: "Animals protect their young fiercely." }] },
        { word: "Provide", entries: [{ def: "To give someone something that they need", example: "Trees provide shade on sunny days." }, { def: "To supply or make available for use", example: "This guide provides useful tips." }] }
      ],
      2: [
        { word: "Challenge", entries: [{ def: "Something new and difficult to do", example: "He accepted the challenge with enthusiasm." }, { def: "A task that tests someone's abilities", example: "Learning a new language is a fun challenge." }] },
        { word: "Imagine", entries: [{ def: "To picture something in your mind", example: "Can you imagine living on Mars?" }, { def: "To form a mental image or concept", example: "Imagine a world without any wars." }] },
        { word: "Discover", entries: [{ def: "To find something for the first time", example: "Scientists discover new species every year." }, { def: "To uncover hidden facts or locations", example: "They discovered an old secret passage." }] },
        { word: "Reduce", entries: [{ def: "To make something smaller or less", example: "We should reduce plastic consumption." }, { def: "To diminish in size, amount, or degree", example: "Special discounts reduce shopping costs." }] },
        { word: "Solve", entries: [{ def: "To find the correct answer to a problem", example: "Can you solve this complex math puzzle?" }, { def: "To find a solution to difficulties", example: "Detectives worked hard to solve the mystery." }] },
        { word: "Support", entries: [{ def: "To help someone when they are in trouble", example: "Friends always support each other in tough times." }, { def: "To bear the weight or maintain stability", example: "Strong pillars support the heavy roof." }] },
        { word: "Organize", entries: [{ def: "To put things in good order", example: "Help me organize these files alphabetically." }, { def: "To arrange an event or structure efficiently", example: "She organized a surprise birthday party." }] },
        { word: "Explore", entries: [{ def: "To look around a new place to learn about it", example: "Let's explore the old town streets." }, { def: "To investigate unfamiliar subjects thoroughly", example: "Scientists explore deep oceanic trenches." }] },
        { word: "Advantage", entries: [{ def: "Something good that helps you succeed", example: "Speaking two languages is a big advantage." }, { def: "A condition giving a greater chance of success", example: "Tall players have an advantage in basketball." }] }
      ],
      3: [
        { word: "Achieve", entries: [{ def: "To successfully reach a desired goal through skill or effort", example: "Hard work helps you achieve your goals." }, { def: "To accomplish objectives through perseverance", example: "She achieved remarkable success in science." }] },
        { word: "Succeed", entries: [{ def: "To accomplish a purpose or expected favorable outcome", example: "If you practice daily, you will succeed." }, { def: "To attain prosperity, fame, or desired results", example: "Dedicated entrepreneurs usually succeed." }] },
        { word: "Convince", entries: [{ def: "To persuade someone firmly to believe or do something", example: "She tried to convince him to join the trip." }, { def: "To prove something beyond doubt to someone", example: "His arguments convinced the whole jury." }] },
        { word: "Encourage", entries: [{ def: "To inspire with confidence or hope to take action", example: "Parents should encourage children to read." }, { def: "To foster or stimulate growth and progress", example: "Teachers encourage creative writing habits." }] },
        { word: "Distribute", entries: [{ def: "To hand out or share something among a group of people", example: "Volunteers distribute food to the homeless." }, { def: "To supply goods to retailers or users", example: "The warehouse distributes books nationwide." }] },
        { word: "Campaign", entries: [{ def: "A planned series of organized actions to achieve a goal", example: "The charity launched a new winter campaign." }, { def: "An organized promotional effort in marketing", example: "Advertising campaigns boost product sales." }] },
        { word: "Character", entries: [{ def: "The distinctive mental and moral qualities of a person", example: "Honesty is a core part of his moral character." }, { def: "A printed symbol or letter in typography", example: "Passwords must contain at least one special character." }] },
        { word: "Confirm", entries: [{ def: "To verify or establish the truth and accuracy of facts", example: "Please confirm your flight reservation details." }, { def: "To make certain through official assurance", example: "The office confirmed our meeting schedule." }] },
        { word: "Consider", entries: [{ def: "To think deeply and carefully about a decision or option", example: "Consider all career options before deciding." }, { def: "To regard someone or something as specified", example: "I consider her a dear, trusted friend." }] }
      ],
      4: [
        { word: "Analyze", entries: [{ def: "To examine methodically and in detail to interpret it", example: "We need to analyze the test results carefully." }, { def: "To break down complex data for insights", example: "Analysts study charts to analyze market trends." }] },
        { word: "Collaborate", entries: [{ def: "To work jointly with others on an activity or project", example: "Artists often collaborate on big urban murals." }, { def: "To cooperate on intellectual or creative works", example: "Scientists collaborate across international borders." }] },
        { word: "Evaluate", entries: [{ def: "To assess and judge the quality or significance of something", example: "Teachers evaluate students at term ends." }, { def: "To calculate or appraise value accurately", example: "Engineers evaluated structural bridge safety." }] },
        { word: "Generate", entries: [{ def: "To produce, create, or bring into existence through processes", example: "Wind turbines generate clean electricity." }, { def: "To spark interest or economic revenue", example: "New ads generate massive customer traffic." }] },
        { word: "Appreciate", entries: [{ def: "To fully recognize the value or quality of something", example: "I really appreciate your kind help today." }, { def: "To increase in monetary value over time", example: "Rare vintage guitars appreciate in price." }] },
        { word: "Approach", entries: [{ def: "To come near in distance, time, or quality", example: "The bullet train began to approach the station." }, { def: "A method or way of dealing with problems", example: "We need a fresh approach to marketing." }] },
        { word: "Complex", entries: [{ def: "Consisting of many interconnected or complicated parts", example: "The human brain is a complex biological network." }, { def: "Involving multiple intertwined difficulties", example: "Solving climate change is a complex task." }] },
        { word: "Concept", entries: [{ def: "An abstract idea, principle, or general notion", example: "The concept of spacetime fascinates physicists." }, { def: "A theoretical framework for inventions", example: "Designers tested the new vehicle concept." }] },
        { word: "Conscious", entries: [{ def: "Being fully aware of and responsive to one's environment", example: "She was fully conscious during the medical procedure." }, { def: "Done with deliberate awareness of consequences", example: "He made a conscious lifestyle change." }] }
      ],
      5: [
        { word: "Endure", entries: [{ def: "To patiently suffer through a difficult situation", example: "Pioneers had to endure harsh winter storms." }, { def: "To remain firm, strong, and operational", example: "Classic art pieces endure through centuries." }] },
        { word: "Exceed", entries: [{ def: "To be greater than an established limit or quantity", example: "Speed limits must never be exceeded on roads." }, { def: "To surpass expectations or performance quotas", example: "Her team exceeded all sales targets." }] },
        { word: "Substantial", entries: [{ def: "Of considerable importance, size, value, or worth", example: "They made a substantial financial donation to charity." }, { def: "Solidly built and robust in structure", example: "The old fortress has substantial stone walls." }] },
        { word: "Tremendous", entries: [{ def: "Extremely great in scale, amount, or intensity", example: "This new technology holds tremendous potential." }, { def: "Remarkably wonderful or impressive", example: "We had a tremendous time at the concert." }] },
        { word: "Inevitable", entries: [{ def: "Certain to happen and impossible to prevent", example: "Change is an inevitable part of human life." }, { def: "Bound to occur regardless of efforts", example: "Winter's arrival after autumn is inevitable." }] },
        { word: "Competent", entries: [{ def: "Having the necessary skill or capacity to do tasks well", example: "She is a highly competent department manager." }, { def: "Meeting acceptable standards of proficiency", example: "He proved competent in troubleshooting." }] },
        { word: "Constant", entries: [{ def: "Occurring continuously over a prolonged period", example: "There is a constant hum from the refrigerator." }, { def: "Unwavering and loyal in affection or duty", example: "Dogs remain constant companions to owners." }] },
        { word: "Decline", entries: [{ def: "To gradually become smaller, fewer, or weaker", example: "Retail sales began to decline in late autumn." }, { def: "A downward slope of terrain or numbers", example: "Hikers walked down a steep mountain decline." }] },
        { word: "Determine", entries: [{ def: "To firmly establish an outcome as a direct result", example: "Hard work will determine your professional success." }, { def: "To calculate or decide officially", example: "Judges determine penalties in court trials." }] }
      ]
    };

    const levelConfigs = [
      { level: 1, count: 9, title: "Freshman" },
      { level: 2, count: 9, title: "Sophomore" },
      { level: 3, count: 9, title: "Junior Scholar" },
      { level: 4, count: 9, title: "Senior Expert" },
      { level: 5, count: 9, title: "Doctor of Philosophy (Ph.D.)" }
    ];

    let currentLevelIdx = 0;
    let maxUnlockedLevel = 1;
    let score = 0;
    let targetItem = null;
    let timerInterval = null;
    let levelTimerInterval = null;
    let timeLeft = 25;
    let levelSecondsElapsed = 0;
    let isGameOver = false;
    let waitingForNext = false;
    let audioCtx = null;
    let currentCardsPool = [];

    const gridEl = document.getElementById("cards-grid");
    const defTextEl = document.getElementById("def-text");
    const levelNumEl = document.getElementById("level-num");
    const levelTitleSubEl = document.getElementById("level-title-sub");
    const progressValEl = document.getElementById("progress-val");
    const timerEl = document.getElementById("timer");
    const nextBtnEl = document.getElementById("next-btn");
    const modalScreen = document.getElementById("modal-screen");
    const modalTitle = document.getElementById("modal-title");
    const modalDesc = document.getElementById("modal-desc");
    const modalButtonsContainer = document.getElementById("modal-buttons-container");
    const levelPillBtn = document.getElementById("level-pill-btn");

    function loadProgress() {
      const saved = localStorage.getItem("angryTeacherMaxLevel");
      if (saved) {
        maxUnlockedLevel = parseInt(saved, 10) || 1;
      }
    }

    function saveProgress(completedLevelIdx) {
      const nextLvlNum = completedLevelIdx + 2;
      if (nextLvlNum > maxUnlockedLevel && nextLvlNum <= levelConfigs.length) {
        maxUnlockedLevel = nextLvlNum;
        localStorage.setItem("angryTeacherMaxLevel", maxUnlockedLevel);
      }
    }

    function getBestTime(lvlIdx) {
      const best = localStorage.getItem(`angryTeacherBestTime_lvl_${lvlIdx + 1}`);
      return best ? parseInt(best, 10) : null;
    }

    function saveBestTime(lvlIdx, seconds) {
      const currentBest = getBestTime(lvlIdx);
      if (currentBest === null || seconds < currentBest) {
        localStorage.setItem(`angryTeacherBestTime_lvl_${lvlIdx + 1}`, seconds);
        return true;
      }
      return false;
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSuccessSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(1318.51, now); 
        osc2.frequency.setValueAtTime(1975.54, now);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.6);
        osc2.stop(now + 0.6);
      } catch (e) {}
    }

    function playExplosionSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.8);

        oscGain.gain.setValueAtTime(0.4, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.8);

        const bufferSize = audioCtx.sampleRate * 0.8;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.linearRampToValueAtTime(100, now + 0.8);

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.35, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        noise.start(now);
        noise.stop(now + 0.8);
      } catch (e) {}
    }

    function playErrorSound() {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.35);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      } catch (e) {}
    }

    function startGame(levelIdx = 0) {
      initAudio();
      currentLevelIdx = levelIdx;
      isGameOver = false;
      modalScreen.classList.add("hidden");
      initLevel();
    }

    function initLevel() {
      const config = levelConfigs[currentLevelIdx];
      levelNumEl.textContent = `LEVEL ${config.level}`;
      levelTitleSubEl.textContent = config.title;
      score = 0;
      updateProgress();

      levelSecondsElapsed = 0;
      clearInterval(levelTimerInterval);
      levelTimerInterval = setInterval(() => {
        if (!isGameOver && !waitingForNext) {
          levelSecondsElapsed++;
        }
      }, 1000);

      const levelWordsPool = vocabularyDBByLevel[config.level] || vocabularyDBByLevel[1];
      
      const selectedWords = [...levelWordsPool]
        .sort(() => Math.random() - 0.5)
        .slice(0, 9);

      currentCardsPool = selectedWords.map(item => {
        const randomEntry = item.entries[Math.floor(Math.random() * item.entries.length)];
        return {
          word: item.word,
          def: randomEntry.def,
          example: randomEntry.example
        };
      });

      renderGrid(currentCardsPool);
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");
      pickNextTarget();
    }

    function renderGrid(cards) {
      gridEl.innerHTML = "";
      cards.forEach(item => {
        const cardNode = document.createElement("div");
        cardNode.className = "card";
        cardNode.dataset.word = item.word;

        cardNode.innerHTML = `
          <div class="card-inner">
            <div class="card-front">
              <div class="card-word">${item.word}</div>
            </div>
            <div class="card-back">
              <div class="card-back-text">"${item.example}"</div>
            </div>
          </div>
        `;

        cardNode.addEventListener("click", () => handleCardClick(cardNode, item));
        gridEl.appendChild(cardNode);
      });
    }

    function pickNextTarget() {
      const remainingCards = Array.from(gridEl.children)
        .filter(c => !c.classList.contains("matched"))
        .map(c => currentCardsPool.find(v => v.word === c.dataset.word));

      if (remainingCards.length === 0) {
        clearInterval(timerInterval);
        clearInterval(levelTimerInterval);
        playSuccessSound();
        saveProgress(currentLevelIdx);

        const isNewRecord = saveBestTime(currentLevelIdx, levelSecondsElapsed);
        
        if (currentLevelIdx < levelConfigs.length - 1) {
          showLevelCompletedScreen(isNewRecord, levelSecondsElapsed);
        } else {
          showGameOverScreen("VICTORY!", `🎉 You beat all 5 levels in ${levelSecondsElapsed}s!`, "PLAY AGAIN", () => startGame(0));
        }
        return;
      }

      targetItem = remainingCards[Math.floor(Math.random() * remainingCards.length)];
      defTextEl.textContent = `"${targetItem.def}"`;
      waitingForNext = false;
      nextBtnEl.classList.add("disabled");

      resetTimer();
    }

    function handleCardClick(cardNode, item) {
      if (cardNode.classList.contains("matched")) {
        cardNode.classList.toggle("flipped");
        return;
      }

      if (isGameOver || waitingForNext) return;

      if (item.word === targetItem.word) {
        playSuccessSound();
        clearInterval(timerInterval);
        waitingForNext = true;
        
        cardNode.classList.add("highlighted");
        score++;
        updateProgress();

        nextBtnEl.classList.remove("disabled");

        setTimeout(() => {
          cardNode.classList.remove("highlighted");
          cardNode.classList.add("flipped", "matched");

          const remainingUnmatched = Array.from(gridEl.children).filter(c => !c.classList.contains("matched"));
          if (remainingUnmatched.length === 0) {
            setTimeout(() => {
              clearInterval(timerInterval);
              clearInterval(levelTimerInterval);
              saveProgress(currentLevelIdx);
              const isNewRecord = saveBestTime(currentLevelIdx, levelSecondsElapsed);

              if (currentLevelIdx < levelConfigs.length - 1) {
                showLevelCompletedScreen(isNewRecord, levelSecondsElapsed);
              } else {
                showGameOverScreen("VICTORY!", `🎉 You beat all 5 levels in ${levelSecondsElapsed}s!`, "PLAY AGAIN", () => startGame(0));
              }
            }, 1200);
          }
        }, 1500);

      } else {
        playErrorSound();
        playExplosionSound();
        clearInterval(timerInterval);
        clearInterval(levelTimerInterval);
        isGameOver = true;
        showGameOverScreen("BOOM!", "💥 Your teacher exploded!", "RETRY LEVEL", () => startGame(currentLevelIdx));
      }
    }

    function updateProgress() {
      progressValEl.textContent = `${score}/9`;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = 25;
      timerEl.textContent = `${timeLeft}s`;
      timerInterval = setInterval(() => {
        if (waitingForNext || isGameOver) return;
        timeLeft--;
        timerEl.textContent = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          clearInterval(levelTimerInterval);
          playErrorSound();
          playExplosionSound();
          isGameOver = true;
          showGameOverScreen("BOOM!", "💥 Time ran out!", "RETRY LEVEL", () => startGame(currentLevelIdx));
        }
      }, 1000);
    }

    function showLevelCompletedScreen(isNewRecord, totalSeconds) {
      const currentTitle = levelConfigs[currentLevelIdx].title;
      const nextLevelIndex = currentLevelIdx + 1;
      const nextTitle = levelConfigs[nextLevelIndex].title;
      const best = getBestTime(currentLevelIdx);

      modalTitle.textContent = "LEVEL PASSED!";
      modalDesc.innerHTML = `🎉 Great job! Unlocked <strong>${currentTitle}</strong>.<br>` +
        `⏱ Time: <strong>${totalSeconds}s</strong> ${isNewRecord ? '🔥 (NEW RECORD!)' : `(Best: ${best}s)`}<br><br>` +
        `Next: <strong>${nextTitle}</strong>`;
      
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="next-level-btn">NEXT LEVEL</button>
        <button class="modal-btn secondary" id="menu-btn">LEVEL SELECT</button>
      `;

      modalScreen.classList.remove("hidden");

      document.getElementById("next-level-btn").addEventListener("click", () => {
        modalScreen.classList.add("hidden");
        currentLevelIdx = nextLevelIndex;
        initLevel();
      });

      document.getElementById("menu-btn").addEventListener("click", () => {
        showLevelSelectMenu();
      });
    }

    function showGameOverScreen(title, desc, btnText, callback) {
      modalTitle.textContent = title;
      modalDesc.innerHTML = desc;
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="modal-action-btn">${btnText}</button>
        <button class="modal-btn secondary" id="menu-btn">LEVEL SELECT</button>
      `;
      modalScreen.classList.remove("hidden");

      document.getElementById("modal-action-btn").addEventListener("click", () => {
        modalScreen.classList.add("hidden");
        callback();
      });

      document.getElementById("menu-btn").addEventListener("click", () => {
        showLevelSelectMenu();
      });
    }

    function showLevelSelectMenu() {
      loadProgress();
      modalTitle.textContent = "SELECT LEVEL";
      modalDesc.textContent = "Choose unlocked level:";
      
      let gridHtml = '<div class="level-select-grid">';
      levelConfigs.forEach((cfg, idx) => {
        const isUnlocked = (idx + 1) <= maxUnlockedLevel;
        const bestTime = getBestTime(idx);
        const timeStr = bestTime !== null ? `<br><span style="font-size:0.55rem; color:#2b6777;">Best: ${bestTime}s</span>` : '';
        gridHtml += `
          <button class="level-sel-btn ${isUnlocked ? '' : 'locked'}" data-lvl="${idx}" ${isUnlocked ? '' : 'disabled'}>
            <strong>Lvl ${cfg.level}</strong>
            <span style="font-size:0.6rem; opacity:0.8;">${cfg.title}</span>
            ${timeStr}
          </button>
        `;
      });
      gridHtml += '</div>';

      modalButtonsContainer.innerHTML = gridHtml + `<button class="modal-btn secondary" id="back-start-btn" style="margin-top:6px;">BACK</button>`;

      document.querySelectorAll(".level-sel-btn").forEach(btn => {
        if (!btn.classList.contains("locked")) {
          btn.addEventListener("click", (e) => {
            const lvlIdx = parseInt(e.currentTarget.dataset.lvl, 10);
            startGame(lvlIdx);
          });
        }
      });

      document.getElementById("back-start-btn").addEventListener("click", () => {
        showStartScreen();
      });
    }

    function showStartScreen() {
      loadProgress();
      modalTitle.textContent = "ANGRY TEACHER";
      modalDesc.innerHTML = `Don't let the angry teacher explode — match the correct word!<br><br><strong>You have 25 seconds for each word.</strong>`;
      modalButtonsContainer.innerHTML = `
        <button class="modal-btn" id="modal-start-main-btn">START GAME</button>
        <button class="modal-btn secondary" id="modal-levels-btn">SELECT LEVEL</button>
      `;

      document.getElementById("modal-start-main-btn").addEventListener("click", () => {
        const startLvl = Math.min(maxUnlockedLevel - 1, levelConfigs.length - 1);
        startGame(startLvl >= 0 ? startLvl : 0);
      });

      document.getElementById("modal-levels-btn").addEventListener("click", () => {
        showLevelSelectMenu();
      });
    }

    // Головний слухач для кнопки старту при першому завантаженні
    document.getElementById("modal-start-main-btn").addEventListener("click", () => {
      const startLvl = Math.min(maxUnlockedLevel - 1, levelConfigs.length - 1);
      startGame(startLvl >= 0 ? startLvl : 0);
    });

    levelPillBtn.addEventListener("click", () => {
      clearInterval(timerInterval);
      clearInterval(levelTimerInterval);
      modalScreen.classList.remove("hidden");
      showLevelSelectMenu();
    });

    loadProgress();

    nextBtnEl.addEventListener("click", () => {
      if (waitingForNext && !isGameOver) {
        pickNextTarget();
      }
    });
  </script>
</body>
</html>
