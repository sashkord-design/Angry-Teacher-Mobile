<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Angry Teacher - Mobile Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f7f3e9;
      --card-bg: #fffdf7;
      --card-back-bg: #1e3a40;
      --primary-teal: #2b6777;
      --accent-gold: #e5a93c;
      --accent-red: #d9534f;
      --dark-text: #222222;
      --border-dark: #1f1f1f;
      --shadow-color: rgba(31, 31, 31, 0.85);
      --font-heading: 'Fredoka', sans-serif;
      --font-body: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-body);
      color: var(--dark-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 6px 6px;
      position: relative;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* TOP HEADER PANEL */
    .header-panel {
      background: #f7f3e9;
      border: 3px solid var(--border-dark);
      border-radius: 14px;
      padding: 6px 8px;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .teacher-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .teacher-avatar-svg {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .game-title {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--border-dark);
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .game-subtitle {
      font-size: 0.55rem;
      font-weight: 800;
      color: var(--accent-red);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .stats-row {
      display: flex;
      gap: 5px;
    }

    .stat-pill {
      background: var(--accent-gold);
      border: 2px solid var(--border-dark);
      border-radius: 10px;
      padding: 2px 6px;
      text-align: center;
      min-width: 50px;
      box-shadow: 0 2px 0 var(--shadow-color);
    }

    .stat-pill.teal {
      background: var(--primary-teal);
      color: #ffffff;
    }

    .stat-label {
      font-size: 0.5rem;
      font-weight: 800;
      text-transform: uppercase;
      display: block;
      opacity: 0.9;
    }

    .stat-value {
      font-family: var(--font-heading);
      font-size: 0.8rem;
      line-height: 1.1;
    }

    /* DEFINITION DISPLAY PANEL */
    .definition-card {
      background: var(--primary-teal);
      border: 3px solid var(--border-dark);
      border-radius: 14px;
      padding: 8px 10px;
      color: #ffffff;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 56px;
    }

    .definition-text {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      flex-grow: 1;
      font-style: italic;
    }

    /* UNIFIED TIMER & NEXT BUTTON STYLES */
    .timer-badge, .next-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 2px solid var(--border-dark);
      border-radius: 9px;
      padding: 2px 6px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      white-space: nowrap;
      box-shadow: 0 2px 0 var(--border-dark);
      min-width: 44px;
      height: 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 0px 0 var(--border-dark);
    }

    .next-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    .next-arrow {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      line-height: 1;
    }

    .next-label {
      font-size: 0.4rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      margin-top: 1px;
    }

    /* 3 COLUMNS CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    /* 3D FLIP CARD STYLES */
    .card {
      perspective: 1000px;
      height: 68px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.4s ease;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border: 2.5px solid var(--border-dark);
      border-radius: 11px;
      box-shadow: 0px 3px 0px var(--shadow-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
    }

    .card-front {
      background-color: var(--card-bg);
      color: var(--border-dark);
    }

    .card-word {
      font-family: var(--font-heading);
      font-size: clamp(0.7rem, 3.2vw, 0.88rem);
      word-break: normal;
      overflow-wrap: normal;
      hyphens: manual;
      text-align: center;
      line-height: 1.1;
      width: 100%;
    }

    .card-back {
      background-color: var(--card-back-bg);
      color: #ffffff;
      transform: rotateY(180deg);
      border-color: var(--border-dark);
    }

    .card-back-text {
      font-size: 0.58rem;
      line-height: 1.2;
      font-weight: 400;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card.matched .card-front {
      background-color: #a8dadc;
      opacity: 0.6;
      cursor: default;
    }

    /* OVERLAY SCREEN (START / BOOM) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 31, 31, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-color);
      border: 4px solid var(--border-dark);
      border-radius: 20px;
      padding: 20px 18px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 6px 0 var(--border-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      color: var(--accent-red);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .modal-desc {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--dark-text);
    }

    .modal-btn {
      background: var(--accent-gold);
      color: var(--border-dark);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      padding: 10px 20px;
      font-family: var(--font-heading);
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--border-dark);
      width: 100%;
      margin-top: 4px;
    }

    .modal-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--border-dark);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- START & GAME OVER OVERLAY SCREEN -->
  <div class="modal-overlay" id="modal-screen">
    <div class="modal-box">
      <svg class="teacher-avatar-svg" viewBox="0 0 100 100" style="width:64px; height:64px;">
        <path d="M45 20 Q55 5 70 12" stroke="#d9534f" stroke-width="4" fill="none" stroke-dasharray="3,3"/>
        <circle cx="72" cy="11" r="5" fill="#f39c12"/>
        <circle cx="50" cy="58" r="34" fill="#d9534f" stroke="#1f1f1f" stroke-width="4"/>
        <rect x="42" y="16" width="16" height="10" fill="#1f1f1f" rx="3"/>
        <circle cx="38" cy="52" r="5" fill="#ffffff"/>
        <circle cx="62" cy="52" r="5" fill="#ffffff"/>
        <circle cx="39" cy="52" r="2.5" fill="#1f1f1f"/>
        <circle cx="61" cy="52" r="2.5" fill="#1f1f1f"/>
        <path d="M30 44 L44 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M70 44 L56 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
        <path d="M36 68 Q50 60 64 68" stroke="#1f1f1f" stroke-width="3" fill="none"/>
      </svg>
      
      <div class="modal-title" id="modal-title">ANGRY TEACHER</div>
      
      <div class="modal-desc" id="modal-desc">
        Don't let the angry teacher explode — match the correct word!<br><br>
        <strong>You have 25 seconds for each word.</strong>
      </div>
      
      <button class="modal-btn" id="modal-btn">START GAME</button>
    </div>
  </div>

  <div id="app-container">
    <!-- TOP CONTROL PANEL -->
    <div class="header-panel">
      <div class="teacher-badge">
        <svg class="teacher-avatar-svg" viewBox="0 0 100 100">
          <path d="M45 20 Q55 5 70 12" stroke="#d9534f" stroke-width="4" fill="none" stroke-dasharray="3,3"/>
          <circle cx="72" cy="11" r="5" fill="#f39c12"/>
          <circle cx="50" cy="58" r="34" fill="#d9534f" stroke="#1f1f1f" stroke-width="4"/>
          <rect x="42" y="16" width="16" height="10" fill="#1f1f1f" rx="3"/>
          <circle cx="38" cy="52" r="5" fill="#ffffff"/>
          <circle cx="62" cy="52" r="5" fill="#ffffff"/>
          <circle cx="39" cy="52" r="2.5" fill="#1f1f1f"/>
          <circle cx="61" cy="52" r="2.5" fill="#1f1f1f"/>
          <path d="M30 44 L44 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
          <path d="M70 44 L56 49" stroke="#1f1f1f" stroke-width="3" stroke-linecap="round"/>
          <path d="M36 68 Q50 60 64 68" stroke="#1f1f1f" stroke-width="3" fill="none"/>
        </svg>

        <div class="title-block">
          <div class="game-title">Angry Teacher</div>
          <div class="game-subtitle">YOU MESS UP - HE EXPLODES!</div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pill">
          <span class="stat-label">Level</span>
          <span class="stat-value" id="level-num">1</span>
        </div>
        <div class="stat-pill teal">
          <span class="stat-label">Progress</span>
          <span class="stat-value" id="progress-val">0/9</span>
        </div>
      </div>
    </div>

    <!-- DEFINITION DISPLAY PANEL -->
    <div class="definition-card">
      <div class="timer-badge" id="timer">25s</div>
      <div class="definition-text" id="def-text">Ready to play?</div>
      <button class="next-btn disabled" id="next-btn" title="Next Word">
        <span class="next-arrow">→</span>
        <span class="next-label">next</span>
      </button>
    </div>

    <!-- CARDS GRID (3 PER ROW) -->
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <script>
    // CEFR-GRADED VOCABULARY DATABASE (LEVELS 1-5)
    const vocabularyDBByLevel = {
      // LEVEL 1: A2 (Elementary / Easy)
      1: [
        { word: "Notice", def: "To become aware of something or someone", example: "Did you notice her new haircut today?" },
        { word: "Refuse", def: "To indicate that one is unwilling to do something", example: "They refuse to give up hope." },

      // LEVEL 2: B1- (Pre-Intermediate)
      2: [
        { word: "Challenge", def: "A call to take part in a difficult contest", example: "He accepted the challenge with enthusiasm." },
        { word: "Imagine", def: "To form a mental image of something", example: "Can you imagine living on Mars?" },

        { word: "Solve", def: "To find an answer or explanation for a problem", example: "Can you solve this complex math puzzle?" },
        { word: "Support", def: "To bear weight or give help to someone", example: "Friends always support each other in tough times." },

        { word: "Doubt", def: "A feeling of uncertainty or lack of conviction", example: "I have no doubt that you will pass." }
      ],

      // LEVEL 3: B1+ (Intermediate)
      3: [
        { word: "Achieve", def: "To successfully bring about a desired result", example: "Hard work helps you achieve your goals." },
        { word: "Succeed", def: "To achieve the desired aim or result", example: "If you practice daily, you will succeed." },
        { word: "Convince", def: "To cause someone to believe firmly", example: "She tried to convince him to join the trip." },
        { word: "Encourage", def: "To give support, confidence, or hope to someone", example: "Parents should encourage children to read." },
        { word: "Distribute", def: "To hand shares of something out to people", example: "Volunteers distribute food to the homeless." },
        { word: "Audience", def: "The assembled spectators or listeners", example: "The audience clapped loudly after the show." },
        { word: "
